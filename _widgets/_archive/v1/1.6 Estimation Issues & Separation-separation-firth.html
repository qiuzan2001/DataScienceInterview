/* FRM 知识地图 · 可交互知识组件样式（配合 widgets.js，类名统一 .wg-* 前缀）

   默认白底；仅 .wg-wrap[data-theme="system"] 显式选择系统黑白。
   调色板局部定义，不继承宿主的暗色变量。

   断点按**容器宽度**由 widgets.js 加 .wg-narrow 类来切（媒体查询看的是视口，会判错）。 */
/* 页面级底色：单独打开 HTML 时也是白底；只有 data-wg-theme="system" 才跟随系统黑白 */
html{background:#fff;}
body{margin:0; background:#fff; color:#202938;}
.wg-wrap{
  color-scheme:light;
  --bg:#fff; --text:#202938; --text-dim:#475569; --text-faint:#586579;

  box-sizing:border-box;

  color:var(--text,#e6e8ee);
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; line-height:1.55;
  overflow-wrap:anywhere;          /* 窄面板里长串数字/路径不撑破布局 */
}
.wg-wrap *{box-sizing:border-box;}

/* ---- 头部 ---- */
.wg-head{display:flex; flex-direction:column; gap:3px; margin:0 0 12px;
         border-bottom:1px solid var(--card-border,#262b38); padding-bottom:10px;}

.wg-warn{font-size:11px; color:var(--wg-warn,#e0a15a); margin:0 0 8px;}

/* ---- 主体：宽 → 左控件右图；窄 → 上下堆叠 ---- */
.wg-body{display:grid; grid-template-columns:minmax(180px,250px) minmax(0,1fr); gap:14px; align-items:start;}
.wg-body.wg-nocontrols{grid-template-columns:minmax(0,1fr);}

.wg-wrap.wg-narrow .wg-ctl-list{grid-template-columns:minmax(0,1fr);}
.wg-ctl{display:flex; flex-direction:column; gap:4px; min-width:0;}
.wg-lab{display:flex; justify-content:space-between; align-items:baseline; gap:8px;

.wg-input{width:100%; max-width:100%; font-size:12px; color:var(--text,#e6e8ee);

/* ---- 图区 ---- */
.wg-stage{min-width:0; display:flex; flex-direction:column; gap:8px;}

           border-radius:9px; padding:6px 6px 2px; outline:none;}
.wg-figure:focus-visible{outline:2px solid var(--wg-accent,#7fb8e6);}
/* 只给 viewBox + width:100%，让 SVG 高度自己跟着纵横比走 —— 与鼠标坐标换算才一致 */
.wg-svg{display:block; width:100%; height:auto; overflow:visible;}
.wg-svg text{font-family:inherit; user-select:none;}

/* ---- canvas 后端（只有 scatter / heatmap / surface3d 的密集标记走这条路）----
   混合层，不是替换：SVG 仍是**排版元素**（内嵌时的高度自适应全靠它撑），canvas 只是压在它
   下面一层画密集标记。绝对定位的 left/top/width/height 由 widgets.js 的 mountCanvas 按 SVG 的
   实测矩形写成 px（只靠 inset:0 在图区出现滚动时会错位：滚动容器的 padding box 只有可见那么高）。
   文字与轴一律不进 canvas —— 它们留在 SVG 里才清晰、才跟得上 CSS 主题。 */
.wg-canvas{position:absolute; left:0; top:0; width:100%; height:100%;
          display:block; pointer-events:none; z-index:0;}
/* SVG 抬到 canvas 之上：轴、刻度文字、markers、连线都在 SVG 里，不能被画布盖住 */
.wg-figure > .wg-svg{position:relative; z-index:1;}
/* heatmap 的 canvas 是 .wg-heat 网格里的一项（不绝对定位）：行/列标签仍是 DOM 文本。
   min-width/min-height:0 是为了不让 canvas 的固有尺寸（300×150）反过来撑大网格轨道。 */
.wg-heat > .wg-canvas{position:static; width:100%; height:100%; min-width:0; min-height:0;}
.wg-grid .wg-gline{stroke:var(--card-border,#262b38); stroke-width:1; opacity:.55;}
.wg-axis{stroke:#3a4256; stroke-width:1;}
.wg-zero{stroke:#4a5570; stroke-width:1.2;}
.wg-tick{fill:var(--text-faint,#5a6272); font-size:10px;}
.wg-line{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
.wg-dot{stroke:none;}
.wg-marker{stroke-width:1.4;}
.wg-mk-label{font-size:10px; font-weight:600;}

.wg-cursor-dot{stroke:var(--bg,#0c0e13); stroke-width:1.5;}
.wg-bar{rx:3px;}
.wg-bar-val{font-size:10.5px; fill:var(--text,#e6e8ee); font-weight:600;}
.wg-bar-val.wg-in{fill:#eef1f7;}
.wg-bad-txt{font-size:10.5px; fill:var(--wg-err,#e06a6a);}
.wg-tl-bar{stroke:none;}
.wg-tl-label{font-size:10px; font-weight:600; fill:var(--text,#e6e8ee);}
.wg-tl-amt{font-size:9.5px; fill:var(--text-faint,#5a6272); font-family:ui-monospace,Menlo,monospace;}
.wg-node{fill:var(--card-bg,#171b25); stroke:var(--card-border,#262b38); stroke-width:1.2;}
.wg-node.wg-node-has{cursor:pointer; stroke:#3a4256;}
.wg-node.wg-node-has:hover{stroke:var(--wg-accent,#7fb8e6);}
.wg-node.wg-node-collapsed{stroke-dasharray:4 3;}
.wg-node:focus-visible{outline:2px solid var(--wg-accent,#7fb8e6); outline-offset:1px;}
.wg-node-label{font-size:11.5px; font-weight:600; fill:var(--text,#e6e8ee);}
.wg-node-val{font-size:10px; fill:var(--text-dim,#8b93a7); font-family:ui-monospace,Menlo,monospace;}
.wg-edge{stroke:var(--card-border,#262b38); stroke-width:1.2;}
.wg-edge-label{font-size:9.5px; fill:var(--text-faint,#5a6272); font-family:ui-monospace,Menlo,monospace;}
.wg-custom{min-width:0;}

/* ---- box / ecdf / qq：分布类图形 ----
   颜色由运行时从主题变量（--wg-c1..c6 / --text-*）取，这里只定线宽、虚实与字体，
   背景相关的颜色一律用 var(--card-bg) 之类的变量，不写死深色。 */
.wg-box-q{stroke-width:1.3;}
.wg-box-med{stroke-width:2.4; stroke-linecap:round;}
.wg-box-whi{stroke-width:1.2;}
.wg-box-cap{stroke-width:1.6;}
.wg-box-out{stroke:var(--card-bg,#fff); stroke-width:1;}
.wg-ecd{stroke-width:2; stroke-linejoin:round;}
.wg-qq-ref{fill:none; stroke-width:1.4; stroke-dasharray:6 4;}
.wg-qq-dot{stroke:var(--card-bg,#fff); stroke-width:0.8;}

/* ---- contour / vector / matrix：标量场、向量场与 2×2 矩阵 ----
   颜色一律由运行时从主题变量（--wg-c1..c6 / --text-*）取；这里只定线宽、虚实与字号，
   背景相关颜色用 var(--card-bg) 之类的变量，不写死深色。 */
.wg-contour{fill:none; stroke-width:1.6; stroke-linejoin:round;}
.wg-vec{fill:none; stroke-width:1.1; stroke-linecap:round;}
.wg-field-lab{font-size:10px; font-weight:600;}
.wg-marker-dot{stroke:var(--card-bg,#fff); stroke-width:1;}
.wg-mx-orig{fill:none; stroke:var(--card-border,#cbd5e1); stroke-width:1.3; stroke-dasharray:5 4;}
.wg-mx-basis{fill:none; stroke-width:1.2; stroke-dasharray:5 4;}
.wg-mx-trans{stroke-width:1.6;}
.wg-mx-bimg{fill:none; stroke-width:2; stroke-linecap:round;}
.wg-mx-eigen{stroke-width:1.4; stroke-dasharray:7 4;}
.wg-mx-eimg{fill:none; stroke-width:2; stroke-linecap:round;}
.wg-mx-link{stroke:var(--card-border,#cbd5e1); stroke-width:1; stroke-dasharray:3 3;}
.wg-mx-samp{stroke-width:1.2;}
.wg-mx-img{stroke:var(--card-bg,#fff); stroke-width:1;}

/* ---- 图例 + 游标读数 chip：数值用文字给出，不靠颜色区分 ---- */
.wg-legend{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; min-height:0;}
.wg-legend:empty{display:none;}
.wg-lg-item{display:inline-flex; align-items:center; gap:5px; min-width:0; font-size:11.5px;}
.wg-lg-sw{flex:0 0 auto;}
.wg-lg-label{color:var(--text,#e6e8ee); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
.wg-lg-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--text-faint,#5a6272);
           background:var(--wg-input-bg); border:1px solid var(--card-border,#262b38); border-radius:999px;
           padding:1px 7px; white-space:nowrap; min-width:52px; text-align:center;}
.wg-lg-val.wg-live{color:var(--wg-accent,#7fb8e6); border-color:#2f3b4d;}
.wg-lg-x{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--text-faint,#5a6272);
         border:1px dashed var(--card-border,#262b38); border-radius:999px; padding:1px 8px; white-space:nowrap;}
.wg-caps{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--text-faint,#5a6272);}
.wg-caps:empty{display:none;}

/* ---- readouts ---- */
.wg-readouts{display:grid; gap:7px; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));}
.wg-readouts[hidden]{display:none;}
.wg-ro{background:var(--card-bg,#171b25); border:1px solid var(--card-border,#262b38);

.wg-ro-label{font-size:10.5px; color:var(--text-faint,#5a6272); margin-bottom:2px;

           color:var(--text,#e6e8ee); word-break:break-all;}
.wg-ro-val.wg-bad{color:var(--wg-err,#e06a6a); font-size:11.5px;}

/* ---- 错误框：红框 + [错误] 前缀，出错也不白屏 ---- */
.wg-err{display:flex; flex-direction:column; gap:3px;
        background:rgba(224,106,106,.10); border:1px solid var(--wg-err,#e06a6a);
        border-radius:8px; padding:7px 9px;}
.wg-err[hidden]{display:none;}
.wg-err-line{font-size:11.5px; line-height:1.5; color:var(--wg-err); word-break:break-word;}

/* ---- 说明与页脚 ---- */
.wg-notes{margin-top:12px; border-top:1px solid var(--card-border,#262b38); padding-top:9px;}
.wg-notes-title{font-size:10.5px; letter-spacing:.5px; text-transform:uppercase;
                color:var(--text-faint,#5a6272); margin-bottom:4px;}
.wg-note-list{margin:0; padding-left:16px; font-size:11.5px; color:var(--text-dim,#8b93a7); line-height:1.6;}
.wg-note-list li{margin:2px 0;}
.wg-foot{margin-top:10px; font-size:10.5px; color:var(--text-faint,#5a6272); word-break:break-all;}

/* ---- heatmap：DOM grid，列多时横向滚动而不是挤成一团 ---- */
.wg-heat-wrap{overflow:auto; max-width:100%;}
.wg-heat{display:grid; gap:2px; min-width:0;}
/* matrix 的 2×2 编辑格子：不加这个上限，两列 1fr 会在宽笔记里被拉成每格好几百像素宽，
   数字孤零零飘在巨大方框中央。热力图不加限制——它的列数本来就是内容的一部分。 */
.wg-heat.wg-heat-2x2{max-width:420px;}
.wg-heat-lab{display:flex; align-items:center; justify-content:center; text-align:center;
             font-size:10.5px; color:var(--text-dim,#8b93a7); padding:2px 3px; min-width:0;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wg-heat-lab.wg-row-lab{justify-content:flex-end;}
.wg-heat-cell{min-height:30px; display:flex; align-items:center; justify-content:center;
              border:1px solid transparent; border-radius:4px; padding:2px;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
              color:var(--text,#e6e8ee); overflow:hidden;}
.wg-heat-cell.wg-editable{padding:1px;}          /* 可编辑格子里有常驻输入框，边框交给它画 */
.wg-heat-cell.wg-empty{background:var(--panel-bg); color:var(--text-faint,#5a6272);}
/* 可编辑格子：里面是一个**常驻**的原生 <input type=number>（见 widgets.js 的 cellInput）。
   平时看起来就是一段数字文本，悬停/聚焦才显出输入框的样子 —— 这样"能不能改"一眼可知，
   又不必把格子画成一堆控件。之所以不"点一下再换成输入框"：那样要靠 focus() 抢焦点，
   宿主（内嵌 iframe / 阅读视图）一旦把焦点抢回去就会立刻 blur 提交并把格子还原成原值。 */
.wg-cell-input{width:100%; min-width:0; padding:3px 2px; text-align:center;
               font-family:inherit; font-size:11px; font-weight:inherit;
               color:inherit; background:transparent; cursor:text;
               border:1px solid transparent; border-radius:4px;
               appearance:textfield; -moz-appearance:textfield;}
.wg-cell-input:hover{border-color:var(--card-border,#cbd5e1); background:var(--wg-input-bg,#fff);}
.wg-cell-input:focus{border-color:var(--wg-accent,#1769aa); background:var(--wg-input-bg,#fff);
                     color:var(--text,#202938); outline:none;}
.wg-cell-input:focus-visible{outline:2px solid var(--wg-accent,#1769aa); outline-offset:1px;}
/* 数字上下箭头会把 30px 高的格子挤变形：去掉（键盘上下键照旧可用） */
.wg-cell-input::-webkit-outer-spin-button,
.wg-cell-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.wg-heat-scale{display:flex; align-items:center; flex-wrap:wrap; gap:7px;
               margin-top:7px; font-size:10.5px; color:var(--text-faint,#5a6272);}
.wg-scale-bar{display:flex; width:96px; height:9px; border-radius:3px; overflow:hidden;
              border:1px solid var(--card-border,#262b38);}
.wg-scale-bar span{flex:1 1 auto;}
.wg-scale-note{color:var(--text-faint,#5a6272);}

/* ---- 新增渲染器（regression / pca / descent / surface3d / treefit）---- */
/* 残差竖线：淡一点，别和数据点抢视线 */
.wg-resid-line{stroke-width:1; stroke-dasharray:3 3; opacity:.75;}
.wg-fit-line{stroke-linecap:round;}
.wg-fit-manual{stroke-dasharray:6 4;}
/* PCA 的投影辅助线：更淡，属于"看结构"的辅助元素 */
.wg-proj-line{stroke-width:.9; stroke-dasharray:2 3; opacity:.5;}
.wg-proj-dot{opacity:.85;}
/* 梯度下降轨迹：深红实线 + 点，起点用大一点的实心点（fill 在 JS 里给） */
.wg-gd-path{fill:none; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round;}
.wg-gd-dot{stroke:#fff; stroke-width:.6;}
.wg-gd-end{stroke-width:1.6;}
/* 点图框换起点：给个十字光标，让"这里能点"可发现 */
.wg-click-set{cursor:crosshair;}
.wg-s3{cursor:default;}
.wg-s3-edge{stroke:var(--card-border,#cbd5e1); stroke-width:.8; stroke-opacity:.75;}
.wg-s3-face{stroke-linejoin:round;}
.wg-s3-pt{stroke:#ffffff; stroke-width:.5;}
.wg-s3-path{fill:none; stroke-width:2; stroke-linejoin:round;}
.wg-s3-dot{stroke:#fff; stroke-width:.8;}
.wg-s3-axlabel{font-size:11px; fill:var(--text-dim,#475569);}
.wg-tree-cut{stroke-width:1.2;}
.wg-tree-fit{fill:none; stroke-width:2; stroke-linejoin:round;}
.wg-tree-region{stroke-width:1;}

/* ---- 自动播放按钮（spec.controls[].animate）----
   它是 UI，不是 spec 控件（不占"最多 4 个控件"的名额）。 */
.wg-auto-bar{display:flex; gap:8px; margin-top:9px;}
.wg-auto-btn{font:inherit; font-size:11.5px; line-height:1; padding:5px 9px; cursor:pointer;
             color:var(--text); background:var(--wg-input-bg); border:1px solid var(--card-border);
             border-radius:6px;}
.wg-auto-btn:hover{border-color:var(--wg-accent); color:var(--wg-accent);}
.wg-auto-btn[aria-pressed="true"]{border-color:var(--wg-accent); color:var(--wg-accent);
                                  background:color-mix(in srgb, var(--wg-accent) 12%, var(--wg-input-bg));}
.wg-auto-btn:focus-visible{outline:2px solid var(--wg-accent); outline-offset:1px;}
/* 组件里没有任何过渡动画，这里只是声明：用户的"减少动效"偏好不会被本层违反 */
@media (prefers-reduced-motion: reduce){
  .wg-wrap *{transition:none !important; animation:none !important;}
}

/* Opt-in only; an unmarked widget stays white even on a dark OS. */
@media (prefers-color-scheme: dark){
  .wg-wrap[data-theme="system"]{
    color-scheme:dark;
    --bg:#0c0e13; --text:#e6e8ee; --text-dim:#a6afc0; --text-faint:#a0aabd;
    --panel-bg:#12151d; --card-bg:#171b25; --card-border:#465168;
    --wg-input-bg:#1c212c;
    --wg-accent:#7fb8e6; --wg-warn:#e0a15a; --wg-err:#ff9999;
    --wg-c1:#7fb8e6; --wg-c2:#e0a15a; --wg-c3:#9fd3a0;
    --wg-c4:#c58ee0; --wg-c5:#e08a8a; --wg-c6:#5ec4c4;
  }
  /* 页面底色也要跟着切，否则深色系统下组件四周会留白边（这两条必须在 .wg-wrap…{} 之外） */
  html[data-wg-theme="system"]{background:#0c0e13;}

      svg.appendChild(sv('text', { class: 'wg-mk-label', x: px, y: g.t + 9 + (i % 2) * 11, 'text-anchor': 'middle', fill: col }, m.label || ''));
    });
  }

  /* ---- 控件取值 ---- */
  function optVal(o) { return Array.isArray(o) ? o[0] : o; }
  function optLabel(o) { return Array.isArray(o) ? (o[1] === undefined ? o[0] : o[1]) : o; }
  /* select 的 option 值在 spec 里写成字符串（[["2","加凸性"]]）。若所有 option 值都是数字，
     就把当前值转成 Number 再注入表达式：否则 `1 - D*dy` 这类数值表达式里混进字符串会得到 NaN。
     想比较字符串的写法（mode == "2"）在 Number 化之后依然成立，所以这个转换是向后兼容的。 */
  function selectAllNumeric(c) {
    var opts = Array.isArray(c.options) ? c.options : [];
    if (!opts.length) return false;
    for (var i = 0; i < opts.length; i++) {
      var v = optVal(opts[i]);
      if (v === null || v === undefined || v === '' || !isFinite(Number(v))) return false;
    }
    return true;
  }
  function coerceSelect(c, raw) { return selectAllNumeric(c) ? Number(raw) : String(raw); }
  function ctlDefault(c) {
    var t = String(c.type || 'slider');
    if (t === 'toggle') return !!c.value;
    if (t === 'select') {
      var opts = Array.isArray(c.options) ? c.options : [];
      var cur = c.value === undefined ? (opts.length ? optVal(opts[0]) : '') : c.value;
      return coerceSelect(c, cur);
    }
    if (t === 'text') return c.value === null || c.value === undefined ? '' : String(c.value);
    return num(c.value, num(c.min, 0));
  }
  function readCtl(node, c) {
    var t = String(c.type || 'slider');
    if (t === 'toggle') return !!node.checked;
    if (t === 'select') return coerceSelect(c, node.value);
    if (t === 'text') return node.value;
    var raw = String(node.value == null ? '' : node.value);
    var v = Number(raw);
    if (!isFinite(v)) return /^\s*[-+.eE\s]*$/.test(raw) ? undefined : raw;   // 空/半截数字：当作"还没输完"，维持上一次的值
    return v;
  }
  function ctrlNum(it, key, dflt) { var x = Number(it.values[key]); return isFinite(x) ? x : dflt; }

  /* ---- 宿主元数据 ---- */
  function readMeta() {
    function g(n) {
      var m = null;
      try { m = document.querySelector ? document.querySelector('meta[name="' + n + '"]') : null; }
      catch (e) { m = null; }          // 假 DOM / 缺少选择器支持时按"没有这条 meta"处理
      return m ? String(m.getAttribute('content') || '') : '';
    }
    return { note: g('wg-note'), uid: g('wg-uid'), vault: g('wg-vault'), vaultAbs: g('wg-vault-abs'),
      chrome: g('wg-chrome') };
  }
  function readSpec() {
    var el = document.getElementById('wg-spec');
    if (!el) throw new Error('找不到 id="wg-spec" 的 JSON 脚本节点');
    var raw = el.textContent || '';
    if (!raw.trim()) throw new Error('#wg-spec 是空的');
    var s;
    try { s = JSON.parse(raw); }
    catch (e) { throw new Error('spec JSON 解析失败：' + msgOf(e)); }
    if (!s || typeof s !== 'object' || Array.isArray(s)) throw new Error('spec 顶层不是对象');
    return s;
  }
  function obsidianLink(meta) {
    if (!meta || !meta.note) return null;
    var q = '';
    if (meta.vault) q += 'vault=' + encodeURIComponent(meta.vault) + '&';
    q += 'file=' + encodeURIComponent(meta.note);
    var a = mk('a', 'wg-src', '在 Obsidian 中打开源笔记 ↗');
    a.href = 'obsidian://open?' + q;
    a.setAttribute('rel', 'noopener');
    a.title = meta.note;
    return a;
  }
  function findRoot() {
    var el = document.getElementById('wg-root');
    if (el) return el;
    var main = document.querySelector('main');
    if (main) { if (!main.id) main.id = 'wg-root'; return main; }
    var d = document.createElement('main');
    d.id = 'wg-root';
    if (document.body) document.body.appendChild(d);
    return d;
  }

  /* ============================================================
     5. 组件实例
     ============================================================ */
  function Wg(spec, meta, root) {
    this.broken = !spec;                       // spec 读不出来时只显示错误框，不去猜内容
    this.spec = (spec && typeof spec === 'object' && !Array.isArray(spec)) ? spec : {};
    this.meta = meta || {};
    this.root = root;
    this.uid = ++UID_SEQ;
    this.kind = typeof this.spec.kind === 'string' ? this.spec.kind : 'plot';
    this.vars = (this.spec.vars && typeof this.spec.vars === 'object' && !Array.isArray(this.spec.vars)) ? this.spec.vars : {};
    this.controls = Array.isArray(this.spec.controls) ? this.spec.controls : [];
    this.values = {};                          // 控件当前值（Engine 与它共享引用，读的就是最新值）
    this.ctlRefs = {};
    this.errors = [];
    this.seen = {};
    this.listeners = [];
    this.narrow = false;
    this.width = 0;
    this.pendingKey = null;
    this.cursorG = null;
    this.plotGeom = null;
    this.plotData = null;
    this.legendChips = [];
    this.legendX = null;
    this.theme = readTheme(root);
    this.raf = 0;
    this.lraf = 0;
    this.slim = false;              // 内嵌"只留交互图"模式（build() 里按 meta.wg-chrome 决定）
    this.autoList = [];             // 可自动播放的控件配置（spec.controls[].animate）
    this.auto = null;               // 正在播放时的状态：{cfgs, t0, timer}
    this.__view3d = null;           // surface3d 的拖拽视角覆盖（有控件时不用它）
    for (var i = 0; i < this.controls.length; i++) {
      var c = this.controls[i] || {};
      if (typeof c.key === 'string') this.values[c.key] = ctlDefault(c);
    }
    this.engine = new Engine(this.vars, this.values);
  }

  /* 传给 spec.custom.js 的 api：{fmt, vars, controls, onControl, redraw}（+ setControl 方便写回） */
  Wg.prototype.api = function () {
    var it = this, api = {
      fmt: fmt,
      vars: this.vars,
      onControl: function (key, cb) {
        if (typeof cb === 'function') it.listeners.push({ key: key || '*', cb: cb });
        return api;
      },
      setControl: function (key, v) {
        if (!(key in it.values)) return api;
        it.values[key] = v;
        it.pendingKey = key;
        it.redraw();
        return api;
      },
      redraw: function () { it.redraw(true); return api; }
    };
    Object.defineProperty(api, 'controls', { get: function () { return shallow(it.values); }, enumerable: true });
    return api;
  };

  /* ---- 错误收集：同一条只报一次，最多显示 8 条 ---- */
  Wg.prototype.err = function (msg) {
    var m = '[错误] ' + String(msg);
    if (this.seen[m]) return;
    this.seen[m] = 1;
    this.errors.push(m);
  };
  Wg.prototype.flushErrors = function () {
    var box = this.el && this.el.err;
    if (!box) return;
    clear(box);
    if (!this.errors.length) { box.hidden = true; return; }
    box.hidden = false;
    var n = Math.min(8, this.errors.length);
    for (var i = 0; i < n; i++) box.appendChild(mk('div', 'wg-err-line', this.errors[i]));
    if (this.errors.length > n) box.appendChild(mk('div', 'wg-err-line', '[错误] …还有 ' + (this.errors.length - n) + ' 条问题（同类已合并）'));
  };

  /* 表达式一律经过这里：数字/布尔直接当字面量（spec 里写 value: 5 也合法），其余走编译求值 */
  Wg.prototype.tryEv = function (expr, extra) {
    if (typeof expr === 'number' || typeof expr === 'boolean') return { ok: true, v: expr };
    try { return { ok: true, v: this.engine.eval(expr, extra) }; }
    catch (e) { return { ok: false, msg: msgOf(e), v: NaN }; }
  };
  Wg.prototype.ev = function (expr, extra, where) {
    var r = this.tryEv(expr, extra);
    if (r.ok) return r.v;
    this.err((where ? where + '：' : '') + r.msg);
    return NaN;
  };

  /* 图注行的“口径”标记：det('…') 表示这一行讲的是**方法 / 口径 / 定义 / 公式 / 几何约定**——
     读一遍就够，不随控件与数据的当前值变化，内容属于源笔记。
     完整组件页照旧显示；内嵌精简模式（slim，见 build()）只留交互图，会跳过这些行。
     用法与普通图注条目一致：可传多个参数、可传数组；null / undefined 一律忽略。 */
  function det(t) {
    var parts = [];
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      if (Array.isArray(a)) parts = parts.concat(a); else parts.push(a);
    }
    return { wgCaptionDetail: parts };
  }
  /* 图注条目可以是：普通字符串（照旧）、det(…) 标记的口径行、null（忽略）。
     口径行只在完整版渲染；活数字、可操作提示（拖…/点…/悬停…）、当前状态的警告
     （越出定义域 / 求值失败）都必须保持普通字符串，内嵌时也要看得见。 */
  Wg.prototype.setCaption = function (parts) {
    var box = this.el.caps, it = this;
    clear(box);
    (parts || []).forEach(function (raw) {
      var t = raw, detail = false;
      if (raw && typeof raw === 'object' && raw.wgCaptionDetail) { detail = true; t = raw.wgCaptionDetail; }
      if (!Array.isArray(t)) t = [t];
      if (detail && it.slim) return;               // slim：口径行交给源笔记，图注只留读数与提示
      t.forEach(function (s) { if (s) box.appendChild(mk('span', 'wg-cap', s)); });
    });
  };
  Wg.prototype.figureWidth = function () {
    var w = 0;
    try { w = this.el.figure.clientWidth || 0; } catch (e) { w = 0; }
    if (!w) w = Math.max(240, (this.width || 640) - 32);
    return Math.max(220, Math.floor(w));
  };

  /* ---- 骨架：标题/副标题/链接/控件区/图区/readouts/notes 全部在这里生成 ---- */
  Wg.prototype.build = function () {
    var spec = this.spec;
    var root = this.root;
    root.classList.add('wg-wrap');
    /* 主题：默认白底；spec.theme="system" 时才显式跟随系统黑白（CSS 的 media query 读这两个属性）。 */
    var theme = (spec.theme === 'system') ? 'system' : 'light';
    root.setAttribute('data-theme', theme);
    try { document.documentElement.setAttribute('data-wg-theme', theme); } catch (e) { /* 非浏览器宿主忽略 */ }
    clear(root);

    /* 精简模式（内嵌）：只留标题 + 控件 + 图 + 图例 + 图注 + 读数。
       副标题、来源链接、说明清单、页脚都是"读一遍就够"的解释性文字，内嵌时它们会把图挤下去；
       这些内容应该写进**源笔记**（md），在那里可以和推导、出处、上下文放在一起。
       由宿主（Maps/_tools/widget-embed/view.js）往组件页 <head> 注入
       <meta name="wg-chrome" content="slim"> 触发；单独在浏览器里打开组件页不受影响（完整版）。 */
    var slim = (this.meta.chrome === 'slim');
    this.slim = slim;
    if (slim) root.classList.add('wg-slim');
    /* 同时打到 <html> 上：widgets.css 用 html[data-wg-chrome="slim"] 收紧内边距、
       并对"旧组件页 + 新宿主"兜底隐藏那几个解释性块。 */
    if (slim) {
      try { document.documentElement.setAttribute('data-wg-chrome', 'slim'); } catch (e) { /* 非浏览器宿主忽略 */ }
    }
    var head = mk('div', 'wg-head');
    head.appendChild(mk('h1', 'wg-title', spec.title || '未命名组件'));
    if (!slim) {
      if (spec.subtitle) head.appendChild(mk('p', 'wg-sub', spec.subtitle));
      var link = obsidianLink(this.meta);
      if (link) head.appendChild(link);
      else if (this.meta.note) head.appendChild(mk('span', 'wg-src wg-src-plain', '来源：' + this.meta.note));
    }
    root.appendChild(head);

    if (spec.schema && spec.schema !== VERSION) {
      root.appendChild(mk('div', 'wg-warn', '⚠ spec.schema=' + spec.schema + '，本运行时按 ' + VERSION + ' 解析'));
    }

    var body = mk('div', 'wg-body');
    var ctrls = mk('div', 'wg-controls');
    var figure = mk('div', 'wg-figure');
    var stage = mk('div', 'wg-stage');
    this.el = {
      head: head, body: body, controls: ctrls, stage: stage, figure: figure,
      legend: mk('div', 'wg-legend'), caps: mk('div', 'wg-caps'),
      readouts: mk('div', 'wg-readouts'), err: mk('div', 'wg-err')
    };
    this.el.err.setAttribute('role', 'alert');
    this.el.err.hidden = true;

    this.buildControls(ctrls);

    stage.appendChild(figure);
    stage.appendChild(this.el.legend);
    stage.appendChild(this.el.caps);
    stage.appendChild(this.el.err);
    stage.appendChild(this.el.readouts);
    body.appendChild(ctrls);
    body.appendChild(stage);
    root.appendChild(body);

    var notes = Array.isArray(spec.notes) ? spec.notes : [];
    if (notes.length && !slim) {
      var nb = mk('div', 'wg-notes');
      nb.appendChild(mk('div', 'wg-notes-title', '说明'));
      var ul = mk('ul', 'wg-note-list');
      for (var i = 0; i < notes.length; i++) ul.appendChild(mk('li', null, notes[i]));
      nb.appendChild(ul);
      root.appendChild(nb);
    }

    if (!slim) {
      var foot = mk('div', 'wg-foot');
      foot.textContent = VERSION + ' · build ' + BUILD + (this.meta.uid ? ' · ' + this.meta.uid : '') +
        (this.meta.note ? ' · ' + this.meta.note : '') + ' · 数值由页面内表达式实时计算';
      root.appendChild(foot);
    }
  };

  /* 控件只建一次；之后只更新 values 并重画图区，不重建控件 DOM，
     这样拖动滑杆/在数字框里连续输入时焦点不会丢、状态不会重置。 */
  Wg.prototype.buildControls = function (box) {
    var self = this;
    // 没有控件时把整列去掉：否则空列仍占 180–250px，图区会被挤到窄缝里
    if (!this.controls.length) { box.hidden = true; if (this.el && this.el.body) this.el.body.classList.add('wg-nocontrols'); }
    if (!this.slim) box.appendChild(mk('div', 'wg-ctl-title', '参数'));
    var list = mk('div', 'wg-ctl-list');
    this.autoList = [];
    this.controls.forEach(function (raw, idx) {
      var c = (raw && typeof raw === 'object') ? raw : {};
      var key = typeof c.key === 'string' ? c.key : ('ctrl' + idx);
      var type = String(c.type || 'slider');
      var id = 'wg-ctl-' + self.uid + '-' + idx;
      var row = mk('div', 'wg-ctl');
      var lab = mk('label', 'wg-lab');
      lab.setAttribute('for', id);
      lab.appendChild(mk('span', 'wg-lab-text', c.label || key));
      var valEl = mk('span', 'wg-lab-val', fmt(self.values[key], c.fmt || patternForValue(self.values[key])));
      var acfg = autoCfgOf(c);
      if (acfg) self.autoList.push(acfg);
      row.appendChild(lab);

      var node;
      if (type === 'select') {
        node = mk('select', 'wg-input');
        var opts = Array.isArray(c.options) ? c.options : [];
        opts.forEach(function (o) {
          var op = mk('option', null, optLabel(o));
          op.value = String(optVal(o));
          node.appendChild(op);
        });
        node.value = String(self.values[key]);
      } else if (type === 'toggle') {
        node = mk('input', 'wg-input');
        node.type = 'checkbox';
        node.checked = !!self.values[key];
        valEl.textContent = self.values[key] ? '开' : '关';
      } else if (type === 'number' || type === 'text') {
        node = mk('input', 'wg-input');
        node.type = type === 'number' ? 'number' : 'text';
        if (type === 'number') {
          if (c.min !== undefined) node.min = String(Number(c.min));
          if (c.max !== undefined) node.max = String(Number(c.max));
          node.step = c.step !== undefined ? String(Number(c.step)) : 'any';
        }
        node.value = String(self.values[key]);
      } else {
        node = mk('input', 'wg-input');
        node.type = 'range';
        node.min = String(num(c.min, 0));
        node.max = String(num(c.max, 1));
        node.step = String(num(c.step, (num(c.max, 1) - num(c.min, 0)) / 100));
        node.value = String(self.values[key]);
        if (type !== 'slider') self.err('控件「' + key + '」type=' + type + ' 未定义，已按 slider 渲染');
      }
      node.id = id;
      node.__wgKey = key;
      node.__wgDef = c;
      row.appendChild(node);
      list.appendChild(row);
      self.ctlRefs[key] = { node: node, valEl: valEl, def: c };
    });

    function onEvt(ev) {
      var t = ev.target;
      if (!t || !t.__wgKey) return;
      var k = t.__wgKey, c = t.__wgDef;
      var v = readCtl(t, c);
      if (v === undefined) return;                       // 输入框中间态，维持上一次的值
      if (v === self.values[k]) return;
      self.values[k] = v;
      var ref = self.ctlRefs[k];
      if (ref && ref.valEl) {
        ref.valEl.textContent = String(c.type) === 'toggle' ? (v ? '开' : '关') : fmt(v, c.fmt || patternForValue(v));
      }
      self.pendingKey = k;
      self.schedule();
    }
    list.addEventListener('input', onEvt);
    list.addEventListener('change', onEvt);
    box.appendChild(list);
    if (this.autoList.length) this.buildAutoUI(box);
  };

  /* ---- 窗口/容器尺寸变化：窗口 resize + ResizeObserver，都用 rAF 合并 ---- */
  Wg.prototype.attach = function () {
    var self = this;
    this.bindAutoStop();                                 // 读者一动手就让自动演示停下
    this.onWinResize = function () { self.scheduleLayout(); };
    global.addEventListener('resize', this.onWinResize);
    if (typeof global.ResizeObserver === 'function') {
      try {
        this.ro = new global.ResizeObserver(function () { self.scheduleLayout(); });
        this.ro.observe(this.root);
      } catch (e) { this.ro = null; }
    }
  };
  Wg.prototype.scheduleLayout = function () {
    var self = this;
    if (this.lraf) return;
    /* rAF 是正常路径；嵌入式/后台 webview 可能把它无限节流，所以 80ms 后兜底一次。 */
    function run() {
      if (!self.lraf) return;
      self.lraf = 0;
      if (self.ltimer) { clearTimeout(self.ltimer); self.ltimer = 0; }
      try { self.layout(); } catch (e) { self.err('重排失败：' + msgOf(e)); self.flushErrors(); }
    }
    var raf = global.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    this.lraf = raf(run);
    this.ltimer = setTimeout(run, 80);
  };
  Wg.prototype.layout = function () {
    var w = this.root.clientWidth || 0;
    if (!w) { try { w = Math.round(this.root.getBoundingClientRect().width) || 0; } catch (e) { w = 0; } }
    if (!w) w = 640;                                     // 容器不可见时给个可用宽度，别按 0 画
    var narrow = w < 560;
    var changed = (narrow !== this.narrow) || Math.abs(w - this.width) >= 8;
    this.narrow = narrow;
    this.width = w;
    this.root.classList.toggle('wg-narrow', narrow);
    if (changed && this.el) this.redraw();
    reportHeight();                 // 宽度/窄屏切换可能改了高度，顺手同步一次
  };
  Wg.prototype.schedule = function () {
    var self = this;
    if (this.raf) return;                                // 拖动滑杆会连发 input 事件，合并到一帧只重绘一次
    function run() {
      if (!self.raf) return;
      self.raf = 0;
      if (self.timer) { clearTimeout(self.timer); self.timer = 0; }
      try { self.redraw(); } catch (e) { self.err('重绘失败：' + msgOf(e)); self.flushErrors(); }
    }
    var raf = global.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    this.raf = raf(run);
    this.timer = setTimeout(run, 80);                     // 被 rAF 无限节流的 webview 仍可交互
  };

  /* ============================================================
     5b. 程序化改控件值 + 控件自动播放
     ============================================================ */
  /* 把控件值写回（内部值 + 滑杆/输入框位置 + 标签文字），返回"是否真的变了"。
     为什么要有这条路：自动播放和三维拖拽都要改控件值，若只改 this.values，
     滑杆把手会停在旧位置、标签也不更新，读者看到的界面就和实际算的东西不一致。
     按 step 取整：动画用浮点连续插值，不取整的话标签会显示 3.7000000000000006 这类噪声。 */
  Wg.prototype.setControl = function (key, v) {
    if (!Object.prototype.hasOwnProperty.call(this.values, key)) return false;
    var x = Number(v);
    if (!isFinite(x)) return false;
    var ref = this.ctlRefs ? this.ctlRefs[key] : null;
    var c = ref ? ref.def : null;
    var st = c ? Number(c.step) : NaN;
    if (isFinite(st) && st > 0) x = Math.round(x / st) * st;
    if (this.values[key] === x) return false;
    this.values[key] = x;
    if (ref) {
      var isToggle = !!(c && String(c.type) === 'toggle');
      if (ref.valEl) ref.valEl.textContent = isToggle ? (x ? '开' : '关') : fmt(x, (c && c.fmt) || patternForValue(x));
      try {
        if (ref.node) {
          if (isToggle) ref.node.checked = !!x;
          else ref.node.value = String(x);
        }
      } catch (e) { /* 假 DOM / 只读节点：界面没跟上不影响计算 */ }
    }
    this.pendingKey = key;

      var txt = fmt(r.v, r.fmt || pat);
      var inside = (r.v >= 0) ? (bx + txtW(txt, 10.5) + 8 > x1) : (bx - txtW(txt, 10.5) - 8 < x0);
      var tx = r.v >= 0 ? (inside ? bx - 5 : bx + 5) : (inside ? bx + 5 : bx - 5);
      svg.appendChild(sv('text', {
        class: 'wg-bar-val' + (inside ? ' wg-in' : ''), x: tx, y: cy, 'dominant-baseline': 'middle',
        'text-anchor': r.v >= 0 ? (inside ? 'end' : 'start') : (inside ? 'start' : 'end')
      }, txt));
    });
    xt.forEach(function (v) { svg.appendChild(sv('text', { class: 'wg-tick', x: bpos(v), y: H - 4, 'text-anchor': 'middle' }, fmt(v, pat))); });
    it.el.figure.appendChild(svg);
    it.setCaption([det('条形长度按数值与 0 的距离归一化'), '红字条目表示表达式求值失败']);
  }

  /* ---- scatter ---- */
  /* series.points 直接用；series.expr 只求值一次，要求返回 [[x,y],…]
     （散点不是函数采样，不能按 x 扫，这一点与 plot 的 expr 语义不同） */
  function drawScatter(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var sers = Array.isArray(spec.series) ? spec.series : [];
    if (!sers.length) it.err('scatter 需要 spec.series（至少 1 条）');
    var data = [];
    sers.forEach(function (raw, i) {
      var s = (raw && typeof raw === 'object') ? raw : {};
      var pts = null;
      if (Array.isArray(s.points)) {
        pts = normalizePairs(s.points);
        if (pts.length < s.points.length) it.err('series[' + i + '].points 有 ' + (s.points.length - pts.length) + ' 个非法 [x,y] 点，已跳过');
      } else if (typeof s.expr === 'string') {
        var r = it.tryEv(s.expr, { x: 0, i: i, item: s });
        if (!r.ok) { it.err('series[' + i + ']：' + r.msg); pts = []; }
        else if (Array.isArray(r.v)) pts = normalizePairs(r.v);
        else { it.err('series[' + i + '] 的 expr 必须返回 [[x,y],…] 数组，实际得到 ' + typeof r.v); pts = []; }
      }
      if (!pts) { pts = []; it.err('series[' + i + '] 既没有 points 也没有 expr'); }
      data.push({
        label: s.label || ('系列 ' + (i + 1)), color: s.color || paletteColor(it, i),
        dash: !!s.dash, connect: !!(s.connect || s.line), pts: pts, fmt: s.fmt || null
      });
    });
    var dom = plotDomain(ctx, data);
    var g = frameFor(ctx, ctx.W, dom, 0.58, 170, 360);
    if (spec.x && typeof spec.x.fmt === 'string' && spec.x.fmt) g.xpat = spec.x.fmt;
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '散点图') + '：悬停点查看坐标');
    /* 先入图区再画：canvas 层要按 SVG 的实测矩形对齐（内嵌高度仍由 SVG 定，见 .wg-svg 的注释） */
    it.el.figure.appendChild(svg);
    drawAxes(svg, g);
    /* canvas 后端：点数超过阈值（或 renderer:"canvas"）时点画在 canvas 上，
       省掉"一点一个 <circle> + <title>"；连线是每 series 一个 <path>，不算密集标记，留在 SVG。
       代价是这一版没有逐点悬停提示 —— 图注里写明怎么回到 SVG。 */
    var nPts = 0;
    data.forEach(function (s) { nPts += s.pts.length; });
    var layer = canvasReady(it, 'scatter', nPts);
    var cdraw = layer ? mountCanvas(it, svg, layer, g.W, g.H) : null;
    data.forEach(function (s) {
      if (s.connect && s.pts.length > 1) {
        var sorted = s.pts.slice().sort(function (a, b) { return a[0] - b[0]; });
        var d = linePath(sorted, function (v) { return sx(g, v); }, function (v) { return sy(g, v); });
        if (d) svg.appendChild(sv('path', { class: 'wg-line', d: d, stroke: s.color, 'stroke-dasharray': s.dash ? '6 4' : null, 'stroke-opacity': 0.7 }));
      }
      if (cdraw) return;                                   // 点交给 canvas：下面按 series 一次 fill 提交
      s.pts.forEach(function (p) {
        var dot = sv('circle', { class: 'wg-dot', cx: sx(g, p[0]), cy: sy(g, p[1]), r: 2.6, fill: s.color });
        dot.appendChild(sv('title', null, s.label + '（x=' + fmt(p[0], g.xpat) + '，y=' + fmt(p[1], seriesValueFmt(s, g)) + '）'));
        svg.appendChild(dot);
      });
    });
    if (cdraw) cdraw(function (c2) {
      /* r = 2.6 与 SVG 的 .wg-dot 一致。
         为什么分块提交而不是"整张图一次 fill"：一条路径里塞满 arc 会让光栅化器把整条路径
         按同一套高精度规则扁平化，代价随路径里的弧数**超线性**增长 —— 实测（Chromium，
         1280×720）2 万个圆的单路径要 247 秒，同样的 2 万个圆分成 256 个圆一批则只要 2.7 ms；
         5 万个圆分块 6.9 ms。所以按 CANVAS_ARC_CHUNK 分批：批内共用一条路径、一次 fill
         （省状态切换），批间重置（避免巨型路径）。直线/矩形没有这个问题，别照搬这条结论。 */
      data.forEach(function (s) {
        c2.fillStyle = s.color;
        var pts = s.pts, n = pts.length;
        for (var s0 = 0; s0 < n; s0 += CANVAS_ARC_CHUNK) {
          var end = Math.min(s0 + CANVAS_ARC_CHUNK, n);
          c2.beginPath();
          for (var i = s0; i < end; i++) {
            var x = sx(g, pts[i][0]), y = sy(g, pts[i][1]);
            c2.moveTo(x + CANVAS_DOT_R, y);
            c2.arc(x, y, CANVAS_DOT_R, 0, TAU);
          }
          c2.fill();
        }
      });
    });
    drawMarkers(svg, g, ctx);
    it.xLabel = (spec.x && spec.x.label) ? String(spec.x.label) : 'x';
    buildLegend(it, data, it.xLabel, g.xpat);
    it.setCaption([cdraw
      ? '散点图：点画在 canvas 上（这一版没有逐点悬停提示）；要悬停看某个点的坐标请设 renderer: "svg"'
      : '散点图：悬停某个点可看它的坐标（不做插值，避免读出实际不存在的取值）']);
  }

  /* ---- histogram ---- */
  /* 两种数据来源：histogram.sample（按控件 n 抽样，没有 n 就抽 2000 次）
     或 histogram.values（[[值, 频数],…] 直接画）。stat 只在样本模式下有。 */
  function drawHistogram(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var h = (spec.histogram && typeof spec.histogram === 'object') ? spec.histogram : {};
    var bars = [], stats = null, x0 = Infinity, x1 = -Infinity, cmax = 0;
    it.vars.__samples__ = Object.freeze([]); // never retain the previous redraw's samples
    if (typeof h.sample === 'string' && h.sample.trim()) {
      var n = Math.round(clampNum(ctrlNum(it, 'n', 2000), 10, 200000, 2000));
      var xs = [], bad = 0, firstBad = '';
      for (var i = 0; i < n; i++) {
        var r = it.tryEv(h.sample, { x: 0, i: i, item: h });
        if (r.ok && isFin(r.v)) xs.push(r.v);
        else { bad++; if (!firstBad) firstBad = r.ok ? ('结果不是数字：' + String(r.v)) : r.msg; }
      }
      if (bad) it.err('histogram.sample 有 ' + bad + '/' + n + ' 次求值失败：' + firstBad);
      if (!xs.length) {
        it.err('histogram.sample 没有产生任何有效样本');
      } else {
        var bins = Math.round(clampNum(h.bins, 1, 400, 40));
        var mn = Math.min.apply(null, xs), mx = Math.max.apply(null, xs);
        if (mn === mx) { mn -= 0.5; mx += 0.5; }
        var w = (mx - mn) / bins, counts = [];
        for (var b = 0; b < bins; b++) counts.push(0);
        for (var k = 0; k < xs.length; k++) {
          var idx = Math.floor((xs[k] - mn) / w);
          if (idx < 0) idx = 0;
          if (idx >= bins) idx = bins - 1;
          counts[idx]++;
        }
        for (var b2 = 0; b2 < bins; b2++) bars.push({ x0: mn + b2 * w, x1: mn + (b2 + 1) * w, v: counts[b2] });
        stats = { n: xs.length, mean: mean(xs), sd: sd(xs), min: mn, max: mx };
        /* histogram readout 可用只读 __samples__（数组）：例如 quantile(__samples__, 0.05)。 */
        it.vars.__samples__ = Object.freeze(xs.slice());
      }
    } else if (Array.isArray(h.values)) {
      var pairs = normalizePairs(h.values);
      if (pairs.length < h.values.length) it.err('histogram.values 有 ' + (h.values.length - pairs.length) + ' 个非法 [值, 频数] 对，已跳过');
      if (!pairs.length) it.err('histogram.values 里没有合法的 [值, 频数] 对');
      var gapMin = Infinity;
      for (var p = 1; p < pairs.length; p++) gapMin = Math.min(gapMin, Math.abs(pairs[p][0] - pairs[p - 1][0]));
      if (!isFinite(gapMin) || gapMin <= 0) gapMin = 1;
      pairs.forEach(function (q) {
        var half = gapMin * 0.42;
        bars.push({ x0: q[0] - half, x1: q[0] + half, v: q[1] });
      });
    } else {
      it.err('histogram 既没有 histogram.sample 也没有 histogram.values');
    }
    bars.forEach(function (b) {
      if (b.x0 < x0) x0 = b.x0;
      if (b.x1 > x1) x1 = b.x1;
      if (b.v > cmax) cmax = b.v;
    });
    if (!isFinite(x0) || !isFinite(x1) || x1 <= x0) { x0 = 0; x1 = 1; }
    if (!(cmax > 0)) cmax = 1;
    var dom = { x0: x0, x1: x1, y0: 0, y1: cmax * 1.08 };
    var g = frameFor(ctx, ctx.W, dom, 0.55, 170, 340);
    g.ypat = autoPattern(cmax / 4, cmax);
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '直方图') + '：共 ' + bars.length + ' 个箱');
    drawAxes(svg, g);
    var fill = h.barColor || it.theme.c[0];
    bars.forEach(function (b) {
      if (!(b.v > 0) && b.v !== 0) return;
      var px0 = sx(g, b.x0), px1 = sx(g, b.x1);
      var wpx = Math.max(1, px1 - px0 - 1);
      var yTop = sy(g, b.v);
      var rect = sv('rect', { class: 'wg-bar', x: r2(px0), y: r2(yTop), width: r2(wpx), height: r2(g.t + g.ph - yTop), fill: fill, 'fill-opacity': 0.85, rx: 1 });
      rect.appendChild(sv('title', null, '[' + fmt(b.x0, g.xpat) + ', ' + fmt(b.x1, g.xpat) + ')：' + fmt(b.v, g.ypat)));
      svg.appendChild(rect);
    });
    drawMarkers(svg, g, ctx);
    it.el.figure.appendChild(svg);
    it.setCaption([
      stats ? ('样本 n=' + fmt(stats.n, '0,0') + '，均值 ' + fmt(stats.mean, '0.0000') + '，标准差 ' + fmt(stats.sd, '0.0000')) : null,
      det('竖线标记来自 spec.markers；柱高为频数')
    ]);
  }

  /* ---- box / ecdf / qq 共用的取数：沿用 histogram 的 sample / values 约定 ----
     sample：表达式按控件 n（没有 n 就 2000 次，clamp 10–200000）逐次求值；values：手写数字数组。
     样本以冻结副本写进 it.vars.__samples__，readouts 与 markers 都能读到（见 §6）；
     每次重绘先清空再重新抽样，不保留上一次的样本 —— 与 histogram 的约定完全一致。 */
  function collectSamples(it, src, where) {
    if (!src || typeof src !== 'object') src = {};
    it.vars.__samples__ = Object.freeze([]);
    if (Array.isArray(src.values)) {
      var vals = toNums(src.values);
      if (vals.length < src.values.length) it.err(where + '.values 有 ' + (src.values.length - vals.length) + ' 个非数字项，已跳过');
      if (!vals.length) it.err(where + '.values 里没有合法数字（样本为空）');
      else it.vars.__samples__ = Object.freeze(vals.slice());
      return vals;
    }
    if (typeof src.sample === 'string' && src.sample.trim()) {
      var n = Math.round(clampNum(ctrlNum(it, 'n', 2000), 10, 200000, 2000));
      var xs = [], bad = 0, firstBad = '';
      for (var i = 0; i < n; i++) {
        var r = it.tryEv(src.sample, { x: 0, i: i, item: src });
        if (r.ok && isFin(r.v)) xs.push(r.v);
        else { bad++; if (!firstBad) firstBad = r.ok ? ('结果不是数字：' + String(r.v)) : r.msg; }
      }
      if (bad) it.err(where + '.sample 有 ' + bad + '/' + n + ' 次求值失败：' + firstBad);
      if (!xs.length) it.err(where + '.sample 没有产生任何有效样本（样本为空）');
      else it.vars.__samples__ = Object.freeze(xs.slice());
      return xs;
    }
    it.err(where + ' 既没有 sample（表达式）也没有 values（数字数组）');
    return [];
  }

  /* ---- box ---- */
  /* 单样本箱线图（横轴 = 数据值）。Tukey 口径：箱 = Q1..Q3；须 = 1.5×IQR 以内最远的数据点；
     须外的点单独画成异常点。分位数与内置 quantile() 同一线性插值口径（Q1/Q2/Q3 = quantile(s, .25/.5/.75)）。
     n<2 时四分位数不可用：按缺失处理并报 [错误]，不画成 0 或假箱体。 */
  function drawBox(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var b = (spec.box && typeof spec.box === 'object') ? spec.box : {};
    var vals = collectSamples(it, b, 'box');
    if (!vals.length) return;
    if (vals.length < 2) {
      it.err('box 样本量不足（n=' + vals.length + '）：四分位数与 1.5×IQR 须不可用，按缺失处理（未画图）');
      return;
    }
    var s = vals.slice().sort(function (a, c) { return a - c; });
    var q1 = quantile(s, 0.25), q2 = quantile(s, 0.5), q3 = quantile(s, 0.75);
    var iqr = q3 - q1, fenceLo = q1 - 1.5 * iqr, fenceHi = q3 + 1.5 * iqr;
    var wLo = Infinity, wHi = -Infinity, outs = [];
    s.forEach(function (v) {
      if (v < fenceLo || v > fenceHi) { outs.push(v); return; }
      if (v < wLo) wLo = v;
      if (v > wHi) wHi = v;
    });
    if (!isFinite(wLo)) { wLo = q1; wHi = q3; }        // IQR=0（样本全相等）时须退化成一个点
    /* 数值文本用「按数据量级取位数」的格式，而不是坐标轴刻度格式：轴刻度可以粗（1..100 的轴用整数刻度是对的），
       但把 Q1=3.25 印成 "3" 会和 readouts、箱体边缘对不上。spec.box.fmt 优先。 */
    var vfmt = (typeof b.fmt === 'string' && b.fmt) ? b.fmt
      : patternForValue(Math.max(Math.abs(q1), Math.abs(q2), Math.abs(q3), Math.abs(iqr), Math.abs(wLo), Math.abs(wHi)));
    var dLo = Math.min(wLo, outs.length ? outs[0] : wLo);
    var dHi = Math.max(wHi, outs.length ? outs[outs.length - 1] : wHi);
    var pad = (dHi - dLo) * 0.08 || Math.abs(dHi) * 0.1 || 1;
    var g = frameFor(ctx, ctx.W, { x0: dLo - pad, x1: dHi + pad, y0: 0, y1: 1 }, 0.24, 118, 190);
    g.yticks = [];                                     // 单样本：纵轴不需要数值刻度
    if (typeof b.fmt === 'string' && b.fmt) g.xpat = b.fmt;
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '箱线图') + '：中位数、四分位距与 ' + outs.length + ' 个异常点');
    drawAxes(svg, g);
    var cy = r2(g.t + g.ph / 2), bh = Math.max(20, Math.min(50, g.ph * 0.55));
    var color = b.color || it.theme.c[0], medColor = b.medianColor || it.theme.c[1];
    function hline(xa, xb, cls, tip) {
      var ln = sv('line', { class: cls, x1: r2(sx(g, xa)), y1: cy, x2: r2(sx(g, xb)), y2: cy, stroke: color });
      ln.appendChild(sv('title', null, tip));
      svg.appendChild(ln);
    }
    hline(wLo, q1, 'wg-box-whi', '下须（1.5×IQR 内最小值）：' + fmt(wLo, vfmt));
    hline(q3, wHi, 'wg-box-whi', '上须（1.5×IQR 内最大值）：' + fmt(wHi, vfmt));
    [[wLo, '下须端点'], [wHi, '上须端点']].forEach(function (c) {
      var cap = sv('line', { class: 'wg-box-cap', x1: r2(sx(g, c[0])), y1: r2(cy - bh / 3), x2: r2(sx(g, c[0])), y2: r2(cy + bh / 3), stroke: color });
      cap.appendChild(sv('title', null, c[1] + ' ' + fmt(c[0], vfmt)));
      svg.appendChild(cap);
    });
    var rect = sv('rect', { class: 'wg-box-q', x: r2(sx(g, q1)), y: r2(cy - bh / 2), width: r2(Math.max(1, sx(g, q3) - sx(g, q1))), height: r2(bh), rx: 2, fill: color, 'fill-opacity': 0.18, stroke: color });
    rect.appendChild(sv('title', null, 'Q1 ' + fmt(q1, g.xpat) + '，中位数 ' + fmt(q2, g.xpat) + '，Q3 ' + fmt(q3, g.xpat) + '（n=' + s.length + '）'));
    svg.appendChild(rect);
    var med = sv('line', { class: 'wg-box-med', x1: r2(sx(g, q2)), y1: r2(cy - bh / 2), x2: r2(sx(g, q2)), y2: r2(cy + bh / 2), stroke: medColor });
    med.appendChild(sv('title', null, '中位数 ' + fmt(q2, g.xpat)));
    svg.appendChild(med);
    /* 异常点逐点画；样本极大时只画两端各一半 —— 中间的重叠点画出来也分不清，条数在 caption 里如实给出。 */
    var maxOut = 200;
    var drawnOuts = (outs.length <= maxOut) ? outs
      : outs.slice(0, maxOut / 2).concat(outs.slice(outs.length - maxOut / 2));
    drawnOuts.forEach(function (v) {
      var dot = sv('circle', { class: 'wg-dot wg-box-out', cx: r2(sx(g, v)), cy: cy, r: 2.8, fill: it.theme.c[4] });
      dot.appendChild(sv('title', null, '异常点（须外）：' + fmt(v, g.xpat)));
      svg.appendChild(dot);
    });
    drawMarkers(svg, g, ctx);
    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.setCaption([
      'n=' + fmt(s.length, '0,0') + '，Q1 ' + fmt(q1, vfmt) + '、中位数 ' + fmt(q2, vfmt) + '、Q3 ' + fmt(q3, vfmt) +
        '，IQR ' + fmt(iqr, vfmt) + '；须 [' + fmt(wLo, vfmt) + ', ' + fmt(wHi, vfmt) + ']，异常点 ' + outs.length + ' 个' +
          (outs.length > maxOut ? ('（图为最外 ' + maxOut + ' 个）') : ''),
      det('箱 = Q1..Q3；须 = 1.5×IQR 内最远的数据点（Tukey 口径），须外的点单独画出；竖线标记来自 spec.markers')
    ]);
  }

  /* ---- ecdf ---- */
  /* 经验分布函数 F(x) = #{样本 ≤ x} / n：单调阶梯，起点 (min, 0)、终点 (max, 1)。
     n 超过 maxPoints 时按等间隔抽稀：被跳过的台阶合并到下一个保留点，阶梯位置因此是近似，
     但每个保留点的累积概率与两个端点仍精确。 */
  function drawEcdf(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var e = (spec.ecdf && typeof spec.ecdf === 'object') ? spec.ecdf : {};
    var vals = collectSamples(it, e, 'ecdf');
    if (!vals.length) return;
    var s = vals.slice().sort(function (a, c) { return a - c; });
    var n = s.length;
    var maxPts = Math.round(clampNum(e.maxPoints, 2, 5000, 1200));
    var stride = Math.max(1, Math.ceil(n / maxPts));
    var pts = [[s[0], 0]], i, last = 0;
    for (i = 0; i < n; i += stride) {
      var y = (i + 1) / n;
      pts.push([s[i], y]);                               // 竖直跳：本点（含被跳过的一批）的累积概率
      if (i + stride < n) pts.push([s[i + stride], y]);  // 水平段：接到下一个保留点
      last = i;
    }
    if (last < n - 1) {                                  // 末尾不足一个 stride 时补上，保证终点是 (max, 1)
      pts.push([s[n - 1], (last + 1) / n]);
      pts.push([s[n - 1], 1]);
    }
    var x0 = s[0], x1 = s[n - 1];
    if (x1 <= x0) { x0 -= 0.5; x1 += 0.5; }              // 全部样本相等时给个可看的横轴
    var g = frameFor(ctx, ctx.W, { x0: x0, x1: x1, y0: 0, y1: 1 }, 0.52, 170, 340);
    if (typeof e.fmt === 'string' && e.fmt) g.xpat = e.fmt;
    g.ypat = '0.00';
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '经验分布函数') + '：n=' + n + ' 的单调阶梯');

    svg.appendChild(path);

    it.plotGeom = g;
    it.setCaption([
      'n=' + fmt(n, '0,0') + '，中位数 ' + fmt(quantile(s, 0.5),

  /* ---- qq ---- */
  /* Q-Q 图：横轴 = 理论分位数，纵轴 = 排序后的样本。dist 目前只支持 "normal"：
     横轴取标准正态分位数 z(p_i)，p_i = (i−0.5)/n 是 Hazen 位置（避免 p=0/1 处的 ±∞）。
     参考线只过两个分位点 (z(0.25), Q1) 与 (z(0.75), Q3)：斜率 = IQR / (z75 − z25)，
     中段稳健；两端偏离直线才是尾部形状（厚尾、偏斜）的证据。未知 dist 报 [错误]，不静默按正态画。 */

    if (dist !== 'normal') {

    if (vals.length < 2) {

    var maxPts = Math.round(clampNum(q.maxPoints, 2, 5000, 2000));
    var stride = Math.max(1, Math.ceil(n / maxPts));
    var pts = [], i, last = -1;
    for (i = 0; i < n; i += stride) {                    // 抽稀时仍用完整 n 算 Hazen 位置，点仍落在真 Q-Q 线上
      pts.push([normQuantile((i + 0.5) / n), s[i]]);
      last = i;
    }
    if (last !== n - 1) pts.push([normQuantile((n - 0.5) / n), s[n - 1]]);   // 保留最大样本点
    var q1 = quantile(s, 0.25), q3 = quantile(s, 0.75);

    if (typeof q.fmt === 'string' && q.fmt) g.ypat = q.fmt;
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || 'Q-Q 图') + '：n=' + n + ' 的样本分位数 vs 标准正态分位数');
    drawAxes(svg, g);
    var ref = sv('line', {
      class: 'wg-qq-ref', stroke: it.theme.warn,
      x1: r2(sx(g, xa)), y1: r2(sy(g, ya)), x2: r2(sx(g, xb)), y2: r2(sy(g, yb))
    });
    ref.appendChild(sv('title', null, '四分位参考线：过 (z(0.25), Q1=' + fmt(q1, g.ypat) + ') 与 (z(0.75), Q3=' + fmt(q3, g.ypat) + ')'));
    svg.appendChild(ref);
    var col = q.color || it.theme.c[0];
    pts.forEach(function (p) {
      var dot = sv('circle', { class: 'wg-dot wg-qq-dot', cx: r2(sx(g, p[0])), cy: r2(sy(g, p[1])), r: 2.6, fill: col });
      dot.appendChild(sv('title', null, 'z=' + fmt(p[0], '0.0000') + '，样本=' + fmt(p[1], g.ypat)));
      svg.appendChild(dot);
    });

    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.setCaption([
      '横轴：标准正态分位数 z（Hazen 位置 p=(i−0.5)/n）；纵轴：排序后的样本（n=' + fmt(n, '0,0') + '）',
      stride > 1
        ? ('样本 n=' + n + ' 超过 maxPoints=' + maxPts + '，图中每 ' + stride + ' 个画一个点（位置仍按完整 n 计算）')
        : det('参考线过 (z(0.25), Q1) 与 (z(0.75), Q3)：斜率 = IQR/(z75−z25) ≈ IQR/1.34898；两端偏离参考线说明尾部形状不同')

    }

      rl2.title = rows[r2] !== undefined ? String(rows[r2]) : ('行' + (r2 + 1));
      gp.appendChild(rl2);
      if (layer) rl2.style.gridColumn = '1';   // 行标签钉在第 1 列：数据区整块留给 canvas

    fx.canvas = !!cdraw;
    fx.canvasDraw = cdraw;

    wrap.appendChild(gp);
    it.el.figure.appendChild(wrap);
    it.heatWrap = wrap;
    var scale = mk('div', 'wg-heat-scale');
    fx.scaleMin = mk('span');
    scale.appendChild(fx.scaleMin);
    var bar = mk('div', 'wg-scale-bar');
    for (var s = 0; s <= 8; s++) {

    scale.appendChild(fx.scaleMax);
    scale.appendChild(mk('span', 'wg-scale-note', '低 → 高（数值同时印在格内）'));
    it.el.figure.appendChild(scale);

    it.paintLive = function () { paintHeat(it, h, vals, R, C, hfmt, fx); };

  }
  /* 就地重绘 heatmap：重算色阶、同步未聚焦格子里的显示值、刷新 readouts 用的绑定变量。

      c.cell.style.background = ok ? mixHex(low, accent, (v - st.mn) / (st.mx - st.mn) * 0.82 + 0.06) : '';
      c.cell.title = c.title + ' = ' + (ok ? fmt(v, hfmt) : '无数据');

  }
  /* 逐点求值：返回 {z: z[j][i]（y 行 x 列）, bad, total}；bad 的点是 NaN（缺失）。
     编译缓存（compile 按表达式 + 变量名缓存）保证整个网格只编译一次。 */
  function evalField(it, expr, xs, ys, node, where) {
    var nx = xs.length, ny = ys.length, z = [], bad = 0, firstMsg = '';
    for (var j = 0; j < ny; j++) {
      var row = new Array(nx);
      for (var i = 0; i < nx; i++) {
        var r = it.tryEv(expr, { x: xs[i], y: ys[j], i: j * nx + i, item: node });
        if (r.ok && isFin(r.v)) row[i] = Number(r.v);
        else {
          row[i] = NaN;
          bad++;
          if (!firstMsg) firstMsg = r.ok ? ('结果不是数字：' + trunc(String(r.v), 30)) : r.msg;
        }
      }
      z.push(row);
    }
    if (bad) {
      it.err(where + '：' + bad + '/' + (nx * ny) + ' 个网格点的值不是有限数（已按缺失处理，含缺失点的格子/箭头不画）：' + firstMsg);
    }
    return { z: z, bad: bad, total: nx * ny };
  }

  /* marching squares：对每个格子、每条等值线按 4 个角点与 level 的大小关系分成 16 种情形取交线。
     角点含缺失值的格子整体跳过；5 / 10 两种对角情形用格心平均值消歧，避免画出不存在的交叉。 */
  function edgePt(xa, ya, za, xb, yb, zb, level) {
    var t = (level - za) / (zb - za);
    return [xa + t * (xb - xa), ya + t * (yb - ya)];
  }
  function contourSegments(xs, ys, z, level) {
    var segs = [], nx = xs.length, ny = ys.length;
    for (var j = 0; j < ny - 1; j++) {
      for (var i = 0; i < nx - 1; i++) {
        var z00 = z[j][i], z10 = z[j][i + 1], z11 = z[j + 1][i + 1], z01 = z[j + 1][i];
        if (!isFinite(z00) || !isFinite(z10) || !isFinite(z11) || !isFinite(z01)) continue;
        var b = 0;
        if (z00 > level) b |= 1;                         // 角点：SW=1, SE=2, NE=4, NW=8
        if (z10 > level) b |= 2;
        if (z11 > level) b |= 4;
        if (z01 > level) b |= 8;
        if (b === 0 || b === 15) continue;
        var x0 = xs[i], x1 = xs[i + 1], y0 = ys[j], y1 = ys[j + 1];
        var S = edgePt(x0, y0, z00, x1, y0, z10, level);
        var E = edgePt(x1, y0, z10, x1, y1, z11, level);
        var N = edgePt(x1, y1, z11, x0, y1, z01, level);
        var W = edgePt(x0, y1, z01, x0, y0, z00, level);
        var center = (z00 + z10 + z11 + z01) / 4 > level;
        if (b === 1 || b === 14) segs.push([S, W]);
        else if (b === 2 || b === 13) segs.push([S, E]);
        else if (b === 3 || b === 12) segs.push([W, E]);
        else if (b === 4 || b === 11) segs.push([E, N]);
        else if (b === 6 || b === 9) segs.push([S, N]);
        else if (b === 7 || b === 8) segs.push([W, N]);
        else if (b === 5) {
          if (center) { segs.push([S, E]); segs.push([W, N]); }
          else { segs.push([S, W]); segs.push([E, N]); }
        } else {                                          /* b === 10 */
          if (center) { segs.push([S, W]); segs.push([E, N]); }
          else { segs.push([S, E]); segs.push([W, N]); }
        }
      }
    }
    return segs.filter(function (s) { return s[0][0] !== s[1][0] || s[0][1] !== s[1][1]; }); // 交点重合时（等值线正好过角点）不画零长度段
  }
  /* 像素坐标里的箭头 path：起点 → 终点 + 两条头线；头长 ≤6px 且 ≤45% 线长，短线不画假头。 */
  function arrowD(g, x0, y0, x1, y1, head) {
    var bx = sx(g, x0), by = sy(g, y0), ex = sx(g, x1), ey = sy(g, y1);
    var dx = ex - bx, dy = ey - by, L = Math.sqrt(dx * dx + dy * dy);
    var d = 'M ' + r2(bx) + ' ' + r2(by) + ' L ' + r2(ex) + ' ' + r2(ey);
    if (L < 0.4) return d;
    var hl = Math.min(head || 6, L * 0.45), ang = Math.atan2(dy, dx);
    d += ' M ' + r2(ex) + ' ' + r2(ey) + ' L ' + r2(ex - hl * Math.cos(ang - 0.42)) + ' ' + r2(ey - hl * Math.sin(ang - 0.42));
    d += ' M ' + r2(ex) + ' ' + r2(ey) + ' L ' + r2(ex - hl * Math.cos(ang + 0.42)) + ' ' + r2(ey - hl * Math.sin(ang + 0.42));
    return d;
  }
  /* contour / vector 的标记：给 {x, y} 就画一个点（二维场里的位置），只给 x 沿用 plot 的竖线约定。 */
  function drawFieldMarkers(svg, g, ctx) {
    var ms = Array.isArray(ctx.spec.markers) ? ctx.spec.markers : [], it = ctx.it;
    for (var i = 0; i < ms.length; i++) {
      var m = (ms[i] && typeof ms[i] === 'object') ? ms[i] : { x: ms[i] };
      var xv = (typeof m.x === 'number') ? m.x : it.ev(m.x, { item: m }, 'markers[' + i + '].x');
      var hasY = (typeof m.y === 'number') || (typeof m.y === 'string' && m.y.trim());
      if (!hasY) {
        if (!isFin(xv) || xv < g.xmin || xv > g.xmax) continue;
        var px = sx(g, xv), col0 = m.color || it.theme.warn;
        var ln = sv('line', { class: 'wg-marker', x1: r2(px), y1: g.t, x2: r2(px), y2: g.t + g.ph, stroke: col0, 'stroke-dasharray': '5 4' });
        ln.appendChild(sv('title', null, (m.label || '标记') + ' x=' + fmt(xv, m.fmt || g.xpat)));
        svg.appendChild(ln);
        svg.appendChild(sv('text', { class: 'wg-mk-label', x: r2(px), y: g.t + 9, 'text-anchor': 'middle', fill: col0 }, m.label || ''));
        continue;
      }
      var yv = (typeof m.y === 'number') ? m.y : it.ev(m.y, { item: m }, 'markers[' + i + '].y');
      if (!isFin(xv) || !isFin(yv)) { it.err('markers[' + i + ']：x/y 求值不是有限数，点标记未画'); continue; }
      if (xv < g.xmin || xv > g.xmax || yv < g.ymin || yv > g.ymax) continue;
      var col = m.color || it.theme.warn;
      var dot = sv('circle', { class: 'wg-marker-dot', cx: r2(sx(g, xv)), cy: r2(sy(g, yv)), r: 3.2, fill: col });
      dot.appendChild(sv('title', null, (m.label || '标记') + ' (' + fmt(xv, m.fmt || g.xpat) + ', ' + fmt(yv, m.fmt || g.ypat) + ')'));
      svg.appendChild(dot);
      svg.appendChild(sv('text', { class: 'wg-mk-label', x: r2(sx(g, xv)), y: r2(sy(g, yv) - 6), 'text-anchor': 'middle', fill: col }, m.label || ''));
    }
  }

  /* ---- contour ---- */
  /* 层数口径：N 条等值线在 (zmin, zmax) 内等分，z_k = zmin + k·(zmax−zmin)/(N+1)（k=1…N）——
     不取端点，否则最小值/最大值处的等值线会退化成单点或整条边界。口径写进图注。 */
  function drawContour(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var c = (spec.contour && typeof spec.contour === 'object') ? spec.contour : {};
    var ax = fieldAxes(it, spec, 41);
    if (!ax) return;
    var expr = (typeof c.expr === 'string' && c.expr.trim()) ? c.expr : null;
    if (expr === null) { it.err('contour 需要 contour.expr（f(x, y) 表达式，变量是 x 与 y）'); return; }
    var xs = gridAxis(ax.x0, ax.x1, ax.nx), ys = gridAxis(ax.y0, ax.y1, ax.ny);
    var field = evalField(it, expr, xs, ys, c, 'contour.expr');
    var zmin = Infinity, zmax = -Infinity, j, i;
    for (j = 0; j < field.z.length; j++) {
      for (i = 0; i < field.z[j].length; i++) {
        var v = field.z[j][i];
        if (isFinite(v)) { if (v < zmin) zmin = v; if (v > zmax) zmax = v; }
      }
    }
    if (!isFinite(zmin) || !isFinite(zmax)) {
      it.err('contour：整个网格上 f 都没有有限值，无法确定等值线层（检查表达式与定义域）');
      return;
    }
    if (zmax === zmin) {
      it.err('contour：网格上 f 恒等于 ' + fmt(zmin, patternForValue(zmin)) + '，没有内部等值线可画');
      return;
    }
    var nLv = Math.round(clampNum(c.levels, 1, 20, 6));
    if (c.levels !== undefined && c.levels !== null && Number(c.levels) !== nLv) {
      it.err('contour.levels=' + trunc(String(c.levels), 12) + ' 不在 1–20 的整数范围内，已按 ' + nLv + ' 条计算');
    }
    var fixed = (typeof c.fmt === 'string' && c.fmt) ? c.fmt : null;
    function lvFmt(v2) { return fmt(v2, fixed || patternForValue(v2)); }
    var g = frameFor(ctx, ctx.W, { x0: ax.x0, x1: ax.x1, y0: ax.y0, y1: ax.y1 }, 0.8, 220, 420);
    var aspectCap = applyAspect(ctx, g);
    if (spec.x && typeof spec.x.fmt === 'string' && spec.x.fmt) g.xpat = spec.x.fmt;
    if (spec.y && typeof spec.y.fmt === 'string' && spec.y.fmt) g.ypat = spec.y.fmt;
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '等值线图') + '：f(x, y) 的 ' + nLv + ' 条等值线');
    drawAxes(svg, g);
    var levels = [], k;
    for (k = 1; k <= nLv; k++) levels.push(zmin + (zmax - zmin) * k / (nLv + 1));
    for (k = 0; k < levels.length; k++) {
      var col = c.color || mixHex(it.theme.c[0], it.theme.c[3], (k + 1) / (levels.length + 1));
      var segs = contourSegments(xs, ys, field.z, levels[k]);
      if (segs.length) {
        var d = '';
        for (var s = 0; s < segs.length; s++) {
          d += 'M ' + r2(sx(g, segs[s][0][0])) + ' ' + r2(sy(g, segs[s][0][1])) +
               ' L ' + r2(sx(g, segs[s][1][0])) + ' ' + r2(sy(g, segs[s][1][1]));
        }
        var path = sv('path', { class: 'wg-contour', d: d, stroke: col });
        path.appendChild(sv('title', null, 'f = ' + lvFmt(levels[k]) + '（第 ' + (k + 1) + '/' + nLv + ' 条）'));
        svg.appendChild(path);
      }
      var chip = mk('span', 'wg-lg-item');
      var sw = sv('svg', { class: 'wg-lg-sw', width: 20, height: 8, viewBox: '0 0 20 8', 'aria-hidden': 'true' });
      sw.appendChild(sv('line', { x1: 1, y1: 4, x2: 19, y2: 4, stroke: col, 'stroke-width': 2 }));
      chip.appendChild(sw);
      chip.appendChild(mk('span', 'wg-lg-label', 'f = ' + lvFmt(levels[k])));
      it.el.legend.appendChild(chip);
    }
    drawFieldMarkers(svg, g, ctx);
    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.setCaption([
      aspectCap,
      'f(x, y) = ' + expr + '；网格 ' + ax.nx + '×' + ax.ny + '，f ∈ [' + lvFmt(zmin) + ', ' + lvFmt(zmax) + ']',
      det(nLv + ' 条等值线在 (zmin, zmax) 内等分：z_k = zmin + k·(zmax − zmin)/' + (nLv + 1) + '（k = 1…' + nLv + '），不落在端点'),
      field.bad ? ('有 ' + field.bad + '/' + field.total + ' 个网格点的值不是有限数：按缺失处理，穿过它们的格子不画线') : null
    ]);
  }

  /* ---- vector ---- */
  /* 箭头锚在单元格中心（(nx−1)×(ny−1) 个），u/v 就在这些中心点上求值。
     长度口径（写进图注）：
       auto（默认）：数据空间长度 ∝ |(u,v)|，按全场最大模长归一化，最长箭头 = 0.9×min(单元格宽, 单元格高)；
       unit：所有箭头等长（数据长度 = 0.9×min(Δx, Δy)），只表示方向、不表示大小。
     终点 = 起点 + k·(u,v)（数据坐标），因此箭头是向量在数据坐标里的像。 */
  function drawVector(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var vn = (spec.vector && typeof spec.vector === 'object') ? spec.vector : {};
    var ax = fieldAxes(it, spec, 21);
    if (!ax) return;
    var uExpr = (typeof vn.u === 'string' && vn.u.trim()) ? vn.u : null;
    var vExpr = (typeof vn.v === 'string' && vn.v.trim()) ? vn.v : null;
    if (!uExpr || !vExpr) { it.err('vector 需要 vector.u 与 vector.v（两个分量表达式，变量是 x 与 y）'); return; }
    var mode = (vn.scale === undefined || vn.scale === null || vn.scale === '') ? 'auto' : String(vn.scale);
    if (mode !== 'auto' && mode !== 'unit') {
      it.err('vector.scale 只支持 "auto" 或 "unit"（当前 ' + trunc(mode, 16) + '），已按 auto 画');
      mode = 'auto';
    }
    var xs = gridAxis(ax.x0, ax.x1, ax.nx), ys = gridAxis(ax.y0, ax.y1, ax.ny);
    var cxs = [], cys = [], i, j;
    for (i = 0; i < ax.nx - 1; i++) cxs.push((xs[i] + xs[i + 1]) / 2);
    for (j = 0; j < ax.ny - 1; j++) cys.push((ys[j] + ys[j + 1]) / 2);
    var fu = evalField(it, uExpr, cxs, cys, vn, 'vector.u');
    var fv = evalField(it, vExpr, cxs, cys, vn, 'vector.v');
    var g = frameFor(ctx, ctx.W, { x0: ax.x0, x1: ax.x1, y0: ax.y0, y1: ax.y1 }, 0.8, 220, 420);
    var aspectCap = applyAspect(ctx, g);
    if (spec.x && typeof spec.x.fmt === 'string' && spec.x.fmt) g.xpat = spec.x.fmt;
    if (spec.y && typeof spec.y.fmt === 'string' && spec.y.fmt) g.ypat = spec.y.fmt;
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%', preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '向量场') + '：' + cxs.length + '×' + cys.length + ' 个箭头');
    drawAxes(svg, g);
    var pxX = g.pw / (ax.x1 - ax.x0), pxY = g.ph / (ax.y1 - ax.y0);
    var cellW = g.pw / cxs.length, cellH = g.ph / cys.length;
    var Lmax = 0.9 * Math.min(cellW, cellH);
    var maxVis = 0, M = 0, zeros = 0, missing = 0, cells = [];
    for (j = 0; j < cys.length; j++) {
      for (i = 0; i < cxs.length; i++) {
        var u = fu.z[j][i], v = fv.z[j][i];
        if (!isFinite(u) || !isFinite(v)) { missing++; continue; }
        var mag = Math.sqrt(u * u + v * v);
        if (!(mag > 0)) { zeros++; continue; }
        var vis = Math.sqrt(u * u * pxX * pxX + v * v * pxY * pxY);
        cells.push({ cx: cxs[i], cy: cys[j], u: u, v: v, mag: mag });
        if (mag > M) M = mag;
        if (vis > maxVis) maxVis = vis;
      }
    }
    var fixed = (typeof vn.fmt === 'string' && vn.fmt) ? vn.fmt : null;
    function vvFmt(v2) { return fmt(v2, fixed || patternForValue(v2)); }
    var kAuto = maxVis > 0 ? Lmax / maxVis : 0;
    var kUnit = 0.9 * Math.min((ax.x1 - ax.x0) / cxs.length, (ax.y1 - ax.y0) / cys.length);
    var col = vn.color || it.theme.c[0];
    for (var q = 0; q < cells.length; q++) {
      var cellv = cells[q];
      var kk = mode === 'unit' ? (kUnit / cellv.mag) : kAuto;
      var path = sv('path', { class: 'wg-vec', d: arrowD(g, cellv.cx, cellv.cy, cellv.cx + kk * cellv.u, cellv.cy + kk * cellv.v, 5), stroke: col });
      path.appendChild(sv('title', null, '(' + fmt(cellv.cx, g.xpat) + ', ' + fmt(cellv.cy, g.ypat) + ')：' +
        '(u, v) = (' + vvFmt(cellv.u) + ', ' + vvFmt(cellv.v) + ')，|(u,v)| = ' + vvFmt(cellv.mag)));
      svg.appendChild(path);
    }
    if (!cells.length) {
      it.err('vector：没有可画的箭头' + (missing ? ('；' + missing + ' 个位置 u/v 不是有限数（按缺失处理）') : '') +
             (zeros ? ('；' + zeros + ' 个位置 |(u,v)| = 0（零向量不画）') : ''));
    }
    drawFieldMarkers(svg, g, ctx);
    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.setCaption([
      aspectCap,
      'u = ' + uExpr + '；v = ' + vExpr + '；箭头锚在单元格中心，' + cxs.length + '×' + cys.length + ' 个箭头',
      mode === 'unit'
        ? det('长度口径 unit：所有箭头等长（数据长度 = 0.9×min(Δx, Δy)），只表示方向、不表示 |(u,v)| 大小')
        : det('长度口径 auto：数据空间长度 ∝ |(u,v)|，按全场最大模长归一化，最长箭头 = 0.9×min(单元格宽, 单元格高)，屏幕上不越过一个单元格'),
      det('方向：终点 = 起点 + k·(u,v)（数据坐标）'),
      zeros ? ('|(u,v)| = 0 的 ' + zeros + ' 个点不画箭头') : null
    ]);
  }

  /* ---- matrix ---- */
  /* A = [a b; c d]：det 与特征值由运行时计算（readouts 也能用格子绑定的 a/b/c/d 自己算）。
     Δ < 0 时如实给出 p ± qi，虚部不省略；实平面上没有不变方向，不画特征向量。 */
  function matrixEigen(a, b, c, d) {
    /* 局部量取名 dtr，不要叫 det —— 那是图注口径助手 det(…) 的名字（同名会被这里遮蔽，
       以后在这个函数里调 det('…') 就会炸）。 */
    var tr = a + d, dtr = a * d - b * c, disc = tr * tr - 4 * dtr;
    var tol = 1e-9 * (1 + Math.abs(tr) + Math.abs(dtr) + Math.abs(a) + Math.abs(b) + Math.abs(c) + Math.abs(d));
    var out = {
      tr: tr, det: dtr, disc: disc, tol: tol, real: disc >= -tol,
      l1: NaN, l2: NaN, repeated: false, identityLike: false, eigdirs: [], p: NaN, q: NaN
    };
    if (out.real) {
      var sq = Math.sqrt(Math.max(0, disc));
      out.l1 = (tr + sq) / 2;
      out.l2 = (tr - sq) / 2;
      out.repeated = Math.abs(out.l1 - out.l2) <= tol;
      if (out.repeated) {
        var dir = eigDir(a, b, c, d, out.l1, tol);
        out.identityLike = !dir;                       // A = λI：每个方向都是特征向量
        if (dir) out.eigdirs.push(dir);
      } else {
        var d1 = eigDir(a, b, c, d, out.l1, tol), d2 = eigDir(a, b, c, d, out.l2, tol);
        if (d1) out.eigdirs.push(d1);
        if (d2) out.eigdirs.push(d2);
      }
    } else {
      out.p = tr / 2;
      out.q = Math.sqrt(Math.max(0, -disc)) / 2;
    }
    return out;
  }
  /* (A − λI)v = 0 的单位解：先试 (b, λ−a)，退化成零向量时试 (d−λ, −c)，A = λI 时返回 null。 */
  function eigDir(a, b, c, d, lam, tol) {
    var v1 = [b, lam - a];
    if (Math.abs(v1[0]) > tol || Math.abs(v1[1]) > tol) return unitVec(v1);
    var v2 = [d - lam, -c];
    if (Math.abs(v2[0]) > tol || Math.abs(v2[1]) > tol) return unitVec(v2);
    return null;
  }
  function unitVec(v) { var L = Math.sqrt(v[0] * v[0] + v[1] * v[1]); return [v[0] / L, v[1] / L]; }

  /* matrix 的入口：先把可编辑格子建好（只建一次），再把"画图"交给 paintMatrix。
     之所以拆开：改格子时只能重画图，不能重建格子 DOM（见 cellInput 的注释）。 */
  function drawMatrix(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var m = (spec.matrix && typeof spec.matrix === 'object') ? spec.matrix : {};
    var rows = Array.isArray(m.values) ? m.values : [];
    if (!matrixOk(rows)) { it.err('matrix 需要 matrix.values = [[a, b], [c, d]]（2×2 数字矩阵）'); return; }
    var fixed = (typeof m.fmt === 'string' && m.fmt) ? m.fmt : null;
    function mFmt(v) { return fmt(v, fixed || patternForValue(v)); }
    var wrap = mk('div', 'wg-heat-wrap');
    var gp = mk('div', 'wg-heat wg-heat-2x2');   // 2×2 别被 1fr 拉成每格八百像素宽（见 widgets.css）
    gp.style.gridTemplateColumns = 'minmax(44px, auto) repeat(2, minmax(52px, 1fr))';
    gp.appendChild(mk('div', 'wg-heat-lab'));
    gp.appendChild(mk('div', 'wg-heat-lab', '第 1 列（A·e₁）'));
    gp.appendChild(mk('div', 'wg-heat-lab', '第 2 列（A·e₂）'));
    var labels = ['第 1 行 a、b', '第 2 行 c、d'];
    for (var r = 0; r < 2; r++) {
      gp.appendChild(mk('div', 'wg-heat-lab wg-row-lab', labels[r]));
      for (var cc = 0; cc < 2; cc++) {

  /* ---- timeline ---- */

      rect.appendChild(sv('title', null, rec.label + (val ? ' = ' + val : '') + (rec.hasKids ? '（点击' + (rec.collapsed ? '展开' : '折叠') + '）' : '')));

        rect.setAttribute('aria-label', rec.label + '（子节点' + (rec.collapsed ? '已折叠' : '已展开') + '）');
        rect.addEventListener('click', function () { rec.node.__wgCollapsed = !rec.collapsed; it.redraw(); });
        rect.addEventListener('keydown', function (e) {

        });
      }

      var mark = rec.hasKids ? (rec.collapsed ? '▸ ' : '▾ ') : '';
      nodeG.appendChild(sv('text', { class: 'wg-node-label', x: r2(cx), y: r2(val ? cy - 4 : cy), 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, mark + rec.label));
      if (val) nodeG.appendChild(sv('text', { class: 'wg-node-val', x: r2(cx), y: r2(cy + 11), 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, val));

    }
    place(rootRec, null);
    it.el.figure.appendChild(svg);
    it.setCaption(['点击节点折叠/展开（▸ 表示有折叠的子节点）；节点值与边概率由 vars/控件实时求值']);
  }

  /* ============================================================
     6b. 机器学习 / 统计 / 三维：regression, pca, descent, surface3d, treefit
     ============================================================ */

  /* ---- 共用：图例条目 ---- */
  /* 渲染器自己要说明"实线/虚线/点各代表什么"时用它（plot/scatter 的 buildLegend 带游标联动，
     只适用那两类；这里是不带交互的静态条目：kind 取 'line' | 'dot'）。 */
  function legendChip(it, kind, color, label, dash) {
    var item = mk('span', 'wg-lg-item');
    var sw = sv('svg', { class: 'wg-lg-sw', width: 20, height: 8, viewBox: '0 0 20 8', 'aria-hidden': 'true' });
    if (kind === 'dot') sw.appendChild(sv('circle', { cx: 10, cy: 4, r: 3, fill: color }));
    else sw.appendChild(sv('line', { x1: 1, y1: 4, x2: 19, y2: 4, stroke: color, 'stroke-width': 2,
      'stroke-dasharray': dash ? '5 3' : null }));
    item.appendChild(sw);
    item.appendChild(mk('span', 'wg-lg-label', label));
    it.el.legend.appendChild(item);
    return item;
  }
  function hasCtl(it, key) { return !!(it.values && Object.prototype.hasOwnProperty.call(it.values, key)); }
  function frozen(o) { try { return Object.freeze(o); } catch (e) { return o; } }
  /* 二维数据的显示范围：spec.x / spec.y 给了 min<max 就用它（作者能固定视图，让几张小图对齐），
     否则按数据范围上下留 8% 余量。 */
  function bounds2(spec, pts) {
    var xc = (spec.x && typeof spec.x === 'object') ? spec.x : {};
    var yc = (spec.y && typeof spec.y === 'object') ? spec.y : {};

    pts.forEach(function (p) {
      if (!isFinite(p[0]) || !isFinite(p[1])) return;
      if (p[0] < x0) x0 = p[0];
      if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[1] > y1) y1 = p[1];
    });
    if (!isFinite(x0) || !isFinite(x1) || !(x1 > x0)) { x0 -= 0.5; x1 += 0.5; }
    if (!isFinite(y0) || !isFinite(y1) || !(y1 > y0)) { y0 -= 0.5; y1 += 0.5; }
    var px = (x1 - x0) * 0.08, py = (y1 - y0) * 0.08;
    var out = { x0: x0 - px, x1: x1 + px, y0: y0 - py, y1: y1 + py };
    if (isFin(xc.min) && isFin(xc.max) && xc.max > xc.min) { out.x0 = Number(xc.min); out.x1 = Number(xc.max); }
    if (isFin(yc.min) && isFin(yc.max) && yc.max > yc.min) { out.y0 = Number(yc.min); out.y1 = Number(yc.max); }
    return out;
  }

  /* ---- 共用：造样本数据 ----
     两种给法：
       points: [[x, y], …]          直接给数据（可写进笔记、可复现）
       data: { n, x, y, seed }      逐点求表达式（作用域里有 i、n、控件值，以及 rand()/randn()）
     data 里的 rand()/randn() 用**按 data.seed 播种**的伪随机数，不是全局 Math.random：
     否则每拖动一次别的控件，散点就会重抽一遍，"看同一批数据"这个前提就没了。
     同一个 seed + 同一个 n 一定得到同一批点（种子默认 12345）。 */
  function mulberry32(seed) {
    var a = (Math.floor(num(seed, 12345)) >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededRandn(u) {
    var spare = null;
    return function () {
      if (spare !== null) { var s = spare; spare = null; return s; }
      var u1 = Math.max(1e-12, u()), u2 = u();
      var r = Math.sqrt(-2 * Math.log(u1)), t = 2 * Math.PI * u2;
      spare = r * Math.sin(t);
      return r * Math.cos(t);
    };
  }
  function samplePairs(it, node, where) {
    var out = [];
    if (Array.isArray(node.points)) {
      out = normalizePairs(node.points);
      var dropped = node.points.length - out.length;
      if (dropped) it.err(where + '.points 有 ' + dropped + ' 个非法点（不是 [x, y] 两个有限数），已跳过');
      return out;
    }
    var d = (node.data && typeof node.data === 'object') ? node.data : null;
    if (!d) { it.err(where + ' 需要 points（[[x, y], …]）或 data{n, x, y}（逐点表达式）'); return out; }
    if (typeof d.x !== 'string' || typeof d.y !== 'string') {
      it.err(where + '.data 需要 x 与 y 两个表达式（逐点求值，作用域里有 i、n 与控件值）');
      return out;
    }
    var n = Math.round(clampNum(d.n, 1, 2000, 30));
    if (d.n !== undefined && d.n !== null && Number(d.n) !== n) {
      it.err(where + '.data.n=' + trunc(String(d.n), 12) + ' 不在 1–2000 的整数范围内，已按 ' + n + ' 生成');
    }
    var u = mulberry32(d.seed);
    var extra = { i: 0, x: 0, n: n, item: d, rand: u, randn: seededRandn(u) };
    var bad = 0, firstMsg = '';
    for (var i = 0; i < n; i++) {

         行号始终留在 i 里，所以任何表达式都能用 i 控制趋势。 */
      extra.i = i; extra.x = i;
      var rx = it.tryEv(d.x, extra);
      var xv = rx.ok ? Number(rx.v) : NaN;
      extra.x = xv;
      var ry = it.tryEv(d.y, extra);
      var yv = ry.ok ? Number(ry.v) : NaN;
      if (!isFinite(xv) || !isFinite(yv)) {

        if (!firstMsg) firstMsg = !rx.ok ? ('x：' + rx.msg) : (!ry.ok ? ('y：' + ry.msg) : '求值结果不是有限数');
        continue;
      }
      out.push([xv, yv]);
    }
    if (bad) it.err(where + '.data：' + bad + '/' + n + ' 个点求值失败（已跳过）：' + firstMsg);
    return out;
  }

  /* ---- regression ---- */
  /* 口径（写进图注与 readouts）：拟合 = 普通最小二乘（让 Σ(y − ŷ)² 最小），
     斜率 = sxy/sxx、截距 = ȳ − 斜率·x̄；R² = 1 − SS_res/SS_tot（SS_tot 以 ȳ 为基准）；
     RMSE = √(SS_res/n)（除以 n，不是 n−1）；varY = SS_tot/(n−1)（样本方差）。
     所有 x 相同（sxx = 0）或 n < 2 时斜率没有定义 → 如实给 NaN，不硬凑 0。 */
  function olsFit(pts) {
    var n = pts.length, i;

    var mx = 0, my = 0;
    for (i = 0; i < n; i++) { mx += pts[i][0]; my += pts[i][1]; }
    mx /= n; my /= n;
    var sxx = 0, sxy = 0;
    for (i = 0; i < n; i++) { var dx = pts[i][0] - mx; sxx += dx * dx; sxy += dx * (pts[i][1] - my); }
    var slope = sxx > 0 ? sxy / sxx : NaN;
    var intercept = my - slope * mx;
    var ssRes = 0, ssTot = 0;
    for (i = 0; i < n; i++) {
      var e = pts[i][1] - (slope * pts[i][0] + intercept);

    return { n: n, mx: mx, my: my, sxx: sxx, slope: slope, intercept: intercept,
      ssRes: ssRes, ssTot: ssTot, r2: ssTot > 0 ? 1 - ssRes / ssTot : NaN, rmse: Math.sqrt(ssRes / n) };
  }
  function drawRegression(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var f = (spec.fit && typeof spec.fit === 'object') ? spec.fit : {};
    var pts = samplePairs(it, spec, 'regression');
    if (!pts.length) return;
    if (pts.length < 2) it.err('regression 只有 ' + pts.length + ' 个有效点：斜率与 R² 都没有定义（图上只画点）');
    var mode = String(f.mode || 'ols');
    if (['ols', 'manual', 'compare', 'none'].indexOf(mode) < 0) {
      it.err('fit.mode=' + trunc(mode, 16) + ' 不是 ols/manual/compare/none 之一，已按 ols 画');
      mode = 'ols';
    }
    var slopeKey = typeof f.slopeKey === 'string' ? f.slopeKey : 'slope';
    var intKey = typeof f.interceptKey === 'string' ? f.interceptKey : 'intercept';
    var wantManual = (mode === 'manual' || mode === 'compare');
    var hasManual = hasCtl(it, slopeKey) || isFin(f.slope) || isFin(f.intercept);
    if (wantManual && !hasManual) {
      it.err('regression fit.mode=' + mode + ' 需要控件 key="' + slopeKey + '"（或 spec.fit.slope / fit.intercept 常量）');
      wantManual = false;
      mode = 'ols';
    }
    var mSlope = wantManual ? ctrlNum(it, slopeKey, num(f.slope, 0)) : NaN;
    var mInt = wantManual ? ctrlNum(it, intKey, num(f.intercept, 0)) : NaN;
    var fit = pts.length >= 2 ? olsFit(pts) : null;
    var showOls = (mode === 'ols' || mode === 'compare') && !!fit;

    /* 定义域：散点 + 两条线在两端点的取值都要装进去（手动线很陡时不至于跑出图外） */
    var xc = (spec.x && typeof spec.x === 'object') ? spec.x : {};
    var x0 = Infinity, x1 = -Infinity;
    pts.forEach(function (p) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; });
    if (isFin(xc.min) && isFin(xc.max) && xc.max > xc.min) { x0 = Number(xc.min); x1 = Number(xc.max); }
    if (!isFinite(x0) || !isFinite(x1) || !(x1 > x0)) { x0 -= 0.5; x1 += 0.5; }

    pts.forEach(function (p) { ys.push(p[1]); });

    if (!isFinite(y0) || !isFinite(y1) || !(y1 > y0)) { y0 -= 0.5; y1 += 0.5; }

    var g = frameFor(ctx, ctx.W, { x0: x0, x1: x1, y0: y0 - padY, y1: y1 + padY }, 0.58, 200, 380);
    if (spec.x && typeof spec.x.fmt === 'string' && spec.x.fmt) g.xpat = spec.x.fmt;
    if (spec.y && typeof spec.y.fmt === 'string' && spec.y.fmt) g.ypat = spec.y.fmt;

    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%',
      preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || '回归') + '：' + pts.length + ' 个点与拟合直线');
    drawAxes(svg, g);
    var cOls = it.theme.c[0], cMan = it.theme.c[1], cRes = it.theme.c[4];
    if (showOls && isFinite(fit.slope) && f.residuals !== false) {
      var rs = sv('g', { class: 'wg-resid' });
      pts.forEach(function (p) {
        var yh = fit.slope * p[0] + fit.intercept;
        rs.appendChild(sv('line', { class: 'wg-resid-line', x1: r2(sx(g, p[0])), y1: r2(sy(g, p[1])),
          x2: r2(sx(g, p[0])), y2: r2(sy(g, yh)), stroke: cRes }));
      });
      svg.appendChild(rs);
    }
    if (showOls && isFinite(fit.slope)) {
      var ln = sv('line', { class: 'wg-fit-line', x1: r2(sx(g, x0)), y1: r2(sy(g, fit.slope * x0 + fit.intercept)),
        x2: r2(sx(g, x1)), y2: r2(sy(g, fit.slope * x1 + fit.intercept)), stroke: cOls, 'stroke-width': 2 });
      ln.appendChild(sv('title', null, '最小二乘：ŷ = ' + fmt(fit.slope, '0.0000') + '·x + ' + fmt(fit.intercept, '0.0000')));
      svg.appendChild(ln);
    }
    if (wantManual) {
      svg.appendChild(sv('line', { class: 'wg-fit-line wg-fit-manual', x1: r2(sx(g, x0)), y1: r2(sy(g, mSlope * x0 + mInt)),
        x2: r2(sx(g, x1)), y2: r2(sy(g, mSlope * x1 + mInt)), stroke: cMan, 'stroke-width': 2, 'stroke-dasharray': '6 4' }));
    }
    pts.forEach(function (p) {
      var dot = sv('circle', { class: 'wg-dot', cx: r2(sx(g, p[0])), cy: r2(sy(g, p[1])), r: 2.8, fill: it.theme.c[2] });
      dot.appendChild(sv('title', null, '（x=' + fmt(p[0], g.xpat) + '，y=' + fmt(p[1], g.ypat) + '）'));
      svg.appendChild(dot);

    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.plotData = { pts: pts, fit: fit, mode: mode, mSlope: mSlope, mInt: mInt };

    var st = { n: pts.length, mx: fit ? fit.mx : NaN, my: fit ? fit.my : NaN,

      ssRes: fit ? fit.ssRes : NaN, varY: fit && fit.n > 1 ? fit.ssTot / (fit.n - 1) : NaN };
    if (wantManual && pts.length) {
