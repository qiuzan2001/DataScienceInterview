    it.vars.__reg__ = frozen(st);

    legendChip(it, 'dot', it.theme.c[2], '样本点 n=' + pts.length);
    if (showOls) legendChip(it, 'line', cOls, '最小二乘 ŷ');
    if (wantManual) legendChip(it, 'line', cMan, '手动线', true);
    it.setCaption([
      showOls && isFinite(fit.slope) ? det('竖线 = 残差（y − ŷ）；R² = 1 − SS_res/SS_tot') : null,
      wantManual ? '拖「斜率/截距」让虚线靠近散点，比一比 R²' : null,
      showOls && fit && !isFinite(fit.slope) ? '所有 x 相同 → 斜率没有定义（不是 0）' : null
    ]);
  }

  /* ---- pca ---- */
  /* 口径（写进图注与 readouts）：协方差用**无偏样本口径**（除以 n−1）；
     λ1 ≥ λ2 是 2×2 协方差矩阵的两个特征值，PC1 方向角 θ1 = ½·atan2(2·sxy, sxx − syy)（度，取 [0,180)）；
     解释方差比 = λ1/(λ1+λ2)。候选轴由 θ（度）给出（θ 与 θ+180 是同一条轴）；
     该方向上的方差 = Σ((x−x̄)cosθ + (y−ȳ)sinθ)²/(n−1) = cos²θ·sxx + 2 sinθcosθ·sxy + sin²θ·syy。 */
  function pcaStats(pts, meanCenter) {
    var n = pts.length, i;
    if (!n) return null;
    var mx = 0, my = 0;
    for (i = 0; i < n; i++) { mx += pts[i][0]; my += pts[i][1]; }
    mx /= n; my /= n;
    if (meanCenter === false) { mx = 0; my = 0; }        // 不中心化 = 绕原点做（口径不同，图注里会写明）
    var sxx = 0, syy = 0, sxy = 0;
    for (i = 0; i < n; i++) {
      var dx = pts[i][0] - mx, dy = pts[i][1] - my;
      sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
    }
    var den = n > 1 ? (n - 1) : 1;
    sxx /= den; syy /= den; sxy /= den;
    var tr = sxx + syy, half = (sxx - syy) / 2, disc = Math.sqrt(half * half + sxy * sxy);
    var l1 = tr / 2 + disc, l2 = tr / 2 - disc;
    var ang = 0.5 * Math.atan2(2 * sxy, sxx - syy) * 180 / Math.PI;
    if (ang < 0) ang += 180;
    return { n: n, mx: mx, my: my, sxx: sxx, syy: syy, sxy: sxy, l1: l1, l2: l2,
      angle1: ang, trace: tr, ratio: tr > 0 ? l1 / tr : NaN };
  }
  function pcaVarOn(st, thDeg) {

  function drawPca(ctx) {
    var it = ctx.it, spec = ctx.spec;

    var st = pcaStats(pts, spec.meanCenter !== false);
    var aKey = typeof ca.angleControl === 'string' ? ca.angleControl : 'theta';
    var theta = ctrlNum(it, aKey, num(ca.angle, 0));
    if (ca.angleControl && !hasCtl(it, aKey)) {
      it.err('candidate.angleControl="' + aKey + '" 不是任何控件的 key，已用 candidate.angle=' + fmt(theta, '0.#') + '°');
    }
    var candVar = st ? pcaVarOn(st, theta) : NaN;
    var dom = bounds2(spec, pts);
    var g = frameFor(ctx, ctx.W, dom, 0.8, 220, 420);
    var aspectCap = applyAspect(ctx, g);
    var svg = sv('svg', { class: 'wg-svg', viewBox: '0 0 ' + g.W + ' ' + g.H, width: '100%',
      preserveAspectRatio: 'xMidYMid meet', role: 'img' });
    svg.setAttribute('aria-label', (spec.title || 'PCA') + '：样本点、主轴与候选轴');
    drawAxes(svg, g);

    var t = theta * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    var t1 = st ? st.angle1 * Math.PI / 180 : 0;
    var c1 = Math.cos(t1), s1 = Math.sin(t1);
    /* 1σ 协方差椭圆：mean + √λ1·cosφ·v1 + √λ2·sinφ·v2（半轴 = 标准差 √λ） */
    if (st && st.l1 > 0 && ca.ellipse !== false) {
      var d = '', k;
      for (k = 0; k <= 64; k++) {
        var ph = k / 64 * 2 * Math.PI;
        var ex = st.mx + Math.sqrt(Math.max(0, st.l1)) * Math.cos(ph) * c1 - Math.sqrt(Math.max(0, st.l2)) * Math.sin(ph) * s1;
        var ey = st.my + Math.sqrt(Math.max(0, st.l1)) * Math.cos(ph) * s1 + Math.sqrt(Math.max(0, st.l2)) * Math.sin(ph) * c1;
        d += (k ? ' L ' : 'M ') + r2(sx(g, ex)) + ' ' + r2(sy(g, ey));
      }
      svg.appendChild(sv('path', { class: 'wg-mx-orig', d: d }));
    }
    /* 投影：点到候选轴的垂足（先画，压在点下面） */
    if (ca.showProjection !== false) {
      var pg = sv('g', { class: 'wg-proj' });
      pts.forEach(function (p) {
        var dx = p[0] - (st ? st.mx : 0), dy = p[1] - (st ? st.my : 0);
        var pr = dx * c + dy * s;
        var fx = (st ? st.mx : 0) + pr * c, fy = (st ? st.my : 0) + pr * s;

        if (at2 > lo2 && at2 < hi2) { hit = ri; break; }
      }
      if (hit < 0) { it.err('treefit.splits[' + c2 + ']（' + axis + '=' + fmt(at2, '0.###') + '）没有落在任何区域内部，这一层不切'); continue; }
      var r0 = regions[hit];
      var a3 = { x0: r0.x0, x1: r0.x1, y0: r0.y0, y1: r0.y1 };
      var b3 = { x0: r0.x0, x1: r0.x1, y0: r0.y0, y1: r0.y1 };
      if (axis === 'x') { a3.x1 = at2; b3.x0 = at2; } else { a3.y1 = at2; b3.y0 = at2; }
      regions.splice(hit, 1, a3, b3);
    }
    var clsOrder = [], counts = {};
    tri.forEach(function (p) { if (counts[p[2]] === undefined) { counts[p[2]] = 0; clsOrder.push(p[2]); } counts[p[2]]++; });
    var clsColor = {};
    clsOrder.forEach(function (cname, ci) { clsColor[cname] = paletteColor(it, ci); });
    var wrong = 0, emptyR = 0;
    regions.forEach(function (rg) {
      var cnt = {}, best = null, bestN = 0;
      tri.forEach(function (p) {
        if (p[0] < rg.x0 || p[0] > rg.x1 || p[1] < rg.y0 || p[1] > rg.y1) return;
        cnt[p[2]] = (cnt[p[2]] || 0) + 1;
        if (cnt[p[2]] > bestN) { bestN = cnt[p[2]]; best = p[2]; }
      });
      rg.cls = best;
      rg.n = bestN || 0;
      if (best === null) emptyR++;
      tri.forEach(function (p) {
        if (p[0] < rg.x0 || p[0] > rg.x1 || p[1] < rg.y0 || p[1] > rg.y1) return;
        if (p[2] !== best) wrong++;
      });
    });
    regions.forEach(function (rg) {
      if (rg.cls === null) return;
      var rect = sv('rect', { class: 'wg-tree-region', x: r2(sx(g, rg.x0)), y: r2(sy(g, rg.y1)),
        width: r2(sx(g, rg.x1) - sx(g, rg.x0)), height: r2(sy(g, rg.y0) - sy(g, rg.y1)),
        fill: clsColor[rg.cls], 'fill-opacity': 0.12, stroke: it.theme.c[0], 'stroke-opacity': 0.35 });
      rect.appendChild(sv('title', null, '区域[' + fmt(rg.x0, '0.##') + '–' + fmt(rg.x1, '0.##') + ']×[' +
        fmt(rg.y0, '0.##') + '–' + fmt(rg.y1, '0.##') + '] 判为「' + rg.cls + '」（' + rg.n + ' 点）'));
      svg.appendChild(rect);
    });
    tri.forEach(function (p) {
      var dot = sv('circle', { class: 'wg-dot', cx: r2(sx(g, p[0])), cy: r2(sy(g, p[1])), r: 3, fill: clsColor[p[2]] });
      dot.appendChild(sv('title', null, '类别「' + p[2] + '」（x=' + fmt(p[0], g.xpat) + '，y=' + fmt(p[1], g.ypat) + '）'));
      svg.appendChild(dot);
    });
    it.el.figure.appendChild(svg);
    it.plotGeom = g;
    it.plotData = { regions: regions, points: tri, err: tri.length ? wrong / tri.length : NaN };
    it.vars.__tree__ = frozen({ mode: '2d', depth: depth, maxDepth: maxD, regions: regions.length,
      emptyRegions: emptyR, err: tri.length ? wrong / tri.length : NaN, wrong: wrong, n: tri.length,
      classes: clsOrder.length });
    clsOrder.forEach(function (cname) { legendChip(it, 'dot', clsColor[cname], '类别「' + cname + '」（' + counts[cname] + ' 点）'); });
    it.setCaption([
      aspectCap,
      det('训练错误率 = 被分错的点占比：越深越低，最后可能降到 0（记住训练集 ≠ 学到了规律）'),
      emptyR ? ('有 ' + emptyR + ' 个区域里没有点：它们没有多数类别，图上只画框') : null
    ]);
  }

  /* ---- custom ---- */
  /* spec.custom.html 是**唯一**用 innerHTML 的地方（作者自己写的 HTML）；
     custom.js 用 new Function('root','spec','api', js) 执行，与表达式引擎同一条授权路径。 */
  function drawCustom(ctx) {
    var it = ctx.it, spec = ctx.spec;
    var c = (spec.custom && typeof spec.custom === 'object') ? spec.custom : {};
    var host = mk('div', 'wg-custom');
    it.el.figure.appendChild(host);
    if (typeof c.html === 'string' && c.html) host.innerHTML = c.html;
    if (typeof c.js === 'string' && c.js.trim()) {
      try {
        var fn = Function('root', 'spec', 'api', c.js);
        fn.call(host, host, spec, it.api());
      } catch (e) {
        it.err('custom.js 执行失败：' + msgOf(e));
      }
    } else if (!c.html) {
      it.err('custom 需要 custom.html 或 custom.js');
    }
    it.setCaption([det('custom：内容来自 spec.custom 的 HTML/JS；api.redraw() 不会重建这里的 DOM')]);
  }

  /* ============================================================
     7. 对外入口
     ============================================================ */
  function fatal(root, e) {
    // 兜底：连骨架都建不起来时也要把错误写进页面，绝不留白屏
    try {
      var box = root.querySelector ? root.querySelector('.wg-err') : null;
      if (!box) { box = mk('div', 'wg-err'); root.appendChild(box); }
      box.hidden = false;
      box.appendChild(mk('div', 'wg-err-line', '[错误] 组件渲染失败：' + msgOf(e)));
      box.appendChild(mk('div', 'wg-err-line', '[错误] 已保留页面其余内容；请检查 spec 与 widgets.js 是否完整内联'));
    } catch (e2) { /* 连写错误框都失败：只能放弃，避免二次抛错 */ }
  }

  /* WG.render(rootEl, opt)
     opt = {spec, meta, root}；省略 spec 时从 <script id="wg-spec"> 读，省略 meta 时从 <meta name="wg-*"> 读。
     rootEl 省略时找 #wg-root → <main> → 自建 <main id="wg-root">。
     返回实例句柄 {el, spec, meta, api(), redraw(), values}，宿主不用时可以忽略。 */
  function render(rootEl, opt) {
    var o = opt || {};
    var root = rootEl || o.root || findRoot();
    var meta = o.meta || readMeta();
    var spec = o.spec || null, specErr = null;
    if (!spec) {
      try { spec = readSpec(); }
      catch (e) { specErr = msgOf(e); spec = null; }
    }
    var inst = new Wg(spec, meta, root);
    try {
      inst.build();
      if (specErr) inst.err('无法读取组件 spec：' + specErr);
      inst.attach();
      inst.layout();       // 先定宽度/窄屏类，再画一次
      inst.redraw();
      /* 自动演示：只在真浏览器里自己启动，且首个可播放控件没写 animate.autostart:false。
         放在 redraw 之后：先有一帧完整图形，再从起点开始动，不会先闪一下半成品。 */
      if (!o.noAuto && inst.autoList.length && inst.autoList[0].autostart) inst.autoStart();
    } catch (e) {
      inst.err('渲染中断：' + msgOf(e));
      inst.flushErrors();
      fatal(root, e);
    }
    return inst;
  }

  /* 是否被放进 <iframe>（Obsidian 的 dv.view 内嵌、别的宿主页面）。读 top 在跨源时可能抛，
     抛了就当它不是内嵌。判定结果缓存：一个页面的嵌入状态不会中途改变。 */
  var embedded = null;
  function isEmbedded() {
    if (embedded === null) {
      try { embedded = (global.self !== global.top); }
      catch (e) { embedded = false; }
    }
    return embedded;
  }
  /* 内嵌时给 <html> 打个标记，CSS 据此关掉按视口算的规则（.wg-figure 的 max-height:72vh）——
     内嵌时"视口"就是 iframe 自己，高度该由内容撑，再由 view.js 回设 iframe 高度。
     独立打开组件页时不会有这个标记，行为与以前完全一样。 */
  function markEmbedded() {
    try {
      if (isEmbedded() && global.document && global.document.documentElement) {
        global.document.documentElement.setAttribute('data-wg-embed', '1');
      }
    } catch (e) { /* 忽略 */ }
  }
  /* 内嵌时把"我现在有多高"报给宿主（Maps/_tools/widget-embed/view.js）。
     为什么用 postMessage 而不是只让宿主自己量 iframe 内部：宿主窗口被遮挡时 Chromium 会
     推迟渲染生命周期（rAF / ResizeObserver 都不送），量不到新高度；而 postMessage 由事件循环投递，
     任何时候都到。被沙箱化成不同源时宿主读不到内部文档，也只有这条路。
     以 body 的实测高度为准：body 高度就是内容高度，不受 iframe 视口高低影响。 */
  var reportedHeight = 0;
  function reportHeight() {
    try {
      if (!isEmbedded() || !global.parent || !global.parent.postMessage) return;
      var body = global.document && global.document.body;
      if (!body || !body.getBoundingClientRect) return;
      var h = Math.ceil(body.getBoundingClientRect().height);
      if (!(h > 0) || h === reportedHeight) return;
      reportedHeight = h;
      global.parent.postMessage({ wg: 'widget-height', height: h }, '*');
    } catch (e) { /* 发不出去就算了：同源的宿主还能自己量 */ }
  }

  var booted = false, bootedInst = null;
  /* boot 幂等：宿主显式调用与 DOMContentLoaded 自动调用只会真正生效一次 */
  function boot(opt) {
    if (booted) return bootedInst;
    booted = true;
    markEmbedded();
    try { bootedInst = render(null, opt); }
    catch (e) { fatal(findRoot(), e); }
    return bootedInst;
  }

  global.WG = {
    version: VERSION,
    KINDS: KINDS.slice(),
    /* canvas 后端的公开口径（只读）：哪些 kind 有、auto 阈值、后备存储像素上限。
       只给测试与作者核对"阈值没有被悄悄改动"；渲染路径本身不读这里。 */
    canvasPolicy: { kinds: sortedKeys(CANVAS_KINDS), threshold: shallow(CANVAS_THRESHOLD), maxPx: CANVAS_MAX_PX,
      arcChunk: CANVAS_ARC_CHUNK, dotR: CANVAS_DOT_R },
    fmt: fmt,
    /* z = Φ⁻¹(p)：Q-Q 图用的 Acklam 近似；也开放给测试与 custom 组件自查这个近似。 */
    normQuantile: normQuantile,
    /* 表达式静态分析（只读，见 3b 节）：parse 给 AST、analyze 给 {vars,calls}、
       lintSpec 走一遍 spec 报出语法错误/未知函数/未知变量；供构建期检查与测试用。 */
    parse: parse,
    analyze: analyze,
    lintSpec: lintSpec,
    /* 引擎内部计数器（compiles / cacheHits），只给测试断言"同一表达式只编译一次"用。 */
    __stats: STATS,
    render: render,
    boot: boot,
    /* 内嵌时把自身内容高度报给宿主 iframe；宿主（view.js）也用它兜底。
       属于"宿主驱动"的公开接口，外部一般不用调 —— 重绘/重排后组件会自己报。 */
    reportHeight: reportHeight,
    /* 图注"口径行"的标记：det('…')（也可 det(['…', '…']) 一次给多段）放进 setCaption 的数组里，
       完整组件页照常显示，内嵌精简模式丢掉。普通渲染器直接调用闭包里的同名函数；
       这里开放出来是给测试与 custom 组件的作者（那里拿不到闭包）。 */
    det: det,
    /* 注册外部渲染器：name 是 spec.kind 的取值，fn 收到与内置渲染器一样的 ctx（{it, spec, narrow, W}）。
       用于"独立文件"的扩展渲染器（见 Maps/_tools/plotly-adapter.js）：组件页先内联 adapter、
       再启动，adapter 在这一步把自己挂上来。同一 name 重复注册以最后一次为准（方便热替换）。 */
    registerKind: function (name, fn) {
      if (typeof name === 'string' && name && typeof fn === 'function') EXTERNAL_KINDS[name] = fn;
      return global.WG;
    }
  };
  /* 不管 boot 走哪条路（自动 / 宿主显式调用），先把内嵌标记打上：它只影响 CSS，
     早打上组件一出现就是"由内容撑高"的样子，不会先闪一条内部滚动条。 */
  markEmbedded();
  // 脚本挂在 body 末尾时 DOM 已就绪，直接 boot；挂在 head 里时等 DOMContentLoaded。
  if (typeof document !== 'undefined' && document.getElementById) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { boot(); });
    else boot();
  }
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* 只启动一次：运行时若自己也监听 DOMContentLoaded，这里用 dataset 标记避免重复渲染 */
(function () {
  var d = document.documentElement;
  if (window.WG && typeof WG.boot === 'function' && !d.dataset.wgBooted) {
    d.dataset.wgBooted = '1';
    WG.boot();
  }
})();
</script>
</body>
</html>
